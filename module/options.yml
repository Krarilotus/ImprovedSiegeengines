meta:
  version: 1.0.0
options:
- display: GroupBox
  category:
  - '{{ai}}'
  - '{{improvements}}'
  header: '{{catapults_group}}'
  text: '{{catapults_group_details}}'
  hasHeader: true
  children:
  - url: improved-siegeengines.catapults.enabled
    name: improved-siegeengines-catapults-enabled
    text: '{{catapults_enabled_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{catapults_enabled}}'
  - url: improved-siegeengines.catapults.on_the_way
    name: improved-siegeengines-catapults-on-the-way
    text: '{{catapults_on_the_way_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{catapults_on_the_way}}'
  - url: improved-siegeengines.catapults.other_enemies
    name: improved-siegeengines-catapults-other-enemies
    text: '{{catapults_other_enemies_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{catapults_other_enemies}}'
  - url: improved-siegeengines.catapults.scatter
    name: improved-siegeengines-catapults-scatter
    text: '{{catapults_scatter}}'
    tooltip: '{{catapults_scatter_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 100
      min: 0
      max: 100
      step: 10
- display: GroupBox
  category:
  - '{{ai}}'
  - '{{improvements}}'
  header: '{{tents_group}}'
  text: '{{tents_group_details}}'
  hasHeader: true
  children:
  - url: improved-siegeengines.tents.range
    name: improved-siegeengines-tents-range
    text: '{{tents_range_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{tents_range}}'
  - url: improved-siegeengines.tents.variation
    name: improved-siegeengines-tents-variation
    text: '{{tents_variation}}'
    tooltip: '{{tents_variation_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 10
      min: 0
      max: 30
      step: 1
- display: GroupBox
  category:
  - '{{ai}}'
  - '{{improvements}}'
  header: '{{towers_group}}'
  text: '{{towers_group_details}}'
  hasHeader: true
  children:
