    name: improved-siegeengines-towers-orders
    text: '{{towers_orders_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{towers_orders}}'
  - url: improved-siegeengines.towers.passenger_slow
    name: improved-siegeengines-towers-passenger-slow
    text: '{{towers_passenger_slow}}'
    tooltip: '{{towers_passenger_slow_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: false
  - url: improved-siegeengines.towers.passenger_lift
    name: improved-siegeengines-towers-passenger-lift
    text: '{{towers_passenger_lift}}'
    tooltip: '{{towers_passenger_lift_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 4
      min: -40
      max: 80
      step: 2
- display: GroupBox
  category:
  - '{{ai}}'
