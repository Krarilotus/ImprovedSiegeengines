ai: KI
balance_changes: Balance-Änderungen
bugfixes: Fehlerkorrekturen
catapults_drop_destroyed: Zerstörte Gebäude nicht weiter beschießen
catapults_drop_destroyed_details: Ein Belagerungsgerät, das auf ein Gebäude zielte (eine Feuerballiste auf ein brennbares Ziel oder ein manuell auf ein Gebäude beordertes Katapult), schoss nach dessen Zerstörung weiter auf das leere Feld und zog nie weiter – das Spiel prüfte nur die Gebäudenummer, die bestehen bleibt, bis ein anderes Gebäude sie übernimmt. Nun wird ein zerstörtes Ziel aufgegeben und das Gerät sucht sich ein neues. Gilt für alle Belagerungsgeräte einschließlich Feuerballisten.
catapults_enabled: Katapulte und Triboke wählen eigene Ziele
catapults_enabled_details: 'Aus: KI-Katapulte und -Triboke wählen ihre Ziele genau wie im Originalspiel.'
catapults_group: Katapulte und Triboke
catapults_group_details: |-
  Im Originalspiel sucht ein KI-Katapult immer nur in eine Richtung gleichzeitig nach Zielen und nur nach noch vollständig stehenden Mauern. Findet es nichts, rollt es weiter auf die Burg zu und landet – sofern es unterwegs nicht abgeschossen wird – direkt vor der Mauer.

  Mit dieser Option sucht ein KI-Katapult oder -Tribok zuerst rundum innerhalb seiner vollen Reichweite nach der nächsten feindlichen Mauer, dem nächsten Turm oder Torhaus und beschießt dieses von seinem Standort aus. Bauernhöfe, Werkstätten, Hütten und andere zivile Gebäude werden erst beschossen, wenn keine Befestigung mehr in Reichweite ist. Es rollt nur näher heran, wenn wirklich nichts in Reichweite ist. Sobald der angegriffene Spieler besiegt ist (sein Lord ist tot), beschießt es stattdessen jeden anderen Feind. Feuerballisten verhalten sich im Originalspiel bereits so und bleiben unverändert.
catapults_on_the_way: Katapulte und Triboke halten unterwegs zum Schießen an
catapults_on_the_way_details: Im Originalspiel sucht ein Belagerungsgerät nur im Stillstand nach Zielen, sodass ein KI-Katapult unterwegs – bei einem Überfall, auf dem Marsch der Armee oder beim langsamen Vorrücken – an allem in Reichweite vorbeifährt. Mit dieser Option schaut sich ein fahrendes KI-Katapult oder ein Tribok alle paar Augenblicke rundum um und hält sofort zum Schießen an, sobald eine feindliche Mauer, ein Turm, ein Torhaus oder ein Gebäude in Reichweite kommt, wobei das Ziel wie oben gewählt wird. Erfordert die Option darüber.
catapults_other_enemies: Auch andere Feinde in Reichweite beschießen
catapults_other_enemies_details: Ein KI-Katapult oder -Tribok schießt nur auf den Spieler, den es belagert. Ist nichts von diesem Spieler in Reichweite, rollt es weiter auf dessen Burg zu – an Mauern und Gebäuden anderer Feinde vorbei. Mit dieser Option beschießt es stattdessen diese; Mauern und Gebäude des eigentlich belagerten Spielers behalten aber stets Vorrang, sobald eines in Reichweite ist.
catapults_scatter: Streuung von KI-Katapulten und -Triboken (%)
catapults_scatter_tooltip: Wie stark Schüsse von KI-Katapulten und -Triboken im Vergleich zum Originalspiel streuen. Unter 100 wird die Streuung verkleinert und bei Katapulten auf das Ziel zentriert. 100 belässt die originale Treffgenauigkeit. Deine eigenen Geräte werden nicht verändert.
diagnostics_group: Diagnose
diagnostics_group_descr: Für Tests. Schreibt eine Zeile in ucp3.log, wenn ein KI-Schild, Belagerungsturm oder Baumeister ein neues Ziel erhält, sowie eine Übersicht jeder KI-Belagerungsrunde (was gefunden und was ausgelassen wurde), sobald sich diese ändert.
diagnostics_log: KI-Entscheidungen protokollieren
diagnostics_log_details: Für normales Spielen aus. Schreibt die Belagerungsrunden der KI in ucp3.log sowie jedes Ziel, das ein Katapult oder Tribok wählt (Standort, Zielfeld und was darauf steht).
fixes: Fehlerbehebungen
improvements: Verbesserungen
misc: Sonstiges
oil_aim: Öl nur auf begehbaren Boden gießen
oil_aim_details: 'Ein Baumeister gießt Öl nur dort aus, wo brennendes Öl tatsächlich liegen bleiben kann: auf offenem Boden, nicht auf einer Mauer, Treppe, einem Turm oder einem anderen Gebäude. Von selbst gießen Baumeister nur auf Feinde, die auf solchem Boden stehen. Schickst du ihn auf ein ungeeignetes Feld, gießt er auf das nächste geeignete Bodenfeld innerhalb von 4 Feldern, das höchstens 45 Grad von der Linie zu deinem Ziel abweicht. Gibt es keines, behält er sein Öl und meldet „unmöglicher Ort“ (dieselbe Ansage wie bei unerreichbaren Zielen). Der Kessel weicht außerdem nicht mehr vom anvisierten Punkt ab.'
oil_amount: Anzahl Felder, die ein Ölkessel bedeckt
oil_amount_tooltip: Wie viele Felder das Öl eines Kessels bedeckt. 41 entspricht der Fläche des Feuers im Originalspiel auf offenem Boden.
oil_damage: Brennendes Öl beschädigt berührte Gebäude
oil_damage_details: 'Die Kehrseite: Gebäude, an die das Öl heranfließt, nehmen einmalig Schaden, sobald es sie erreicht – ein Drittel ihrer Lebenspunkte direkt an der Aufschlagstelle, und weiter außen entsprechend weniger. Das betrifft auch deine eigenen Gebäude. Gemeint ist jedes Gebäude, das das spielinterne Feuer entzünden kann: Hütten, Werkstätten, Farmen, Mühlen, Kornspeicher, Waffenkammer, Kaserne, Marktplatz, Ställe, Gilden, Kapelle, Kirche, Kathedrale, Schenke, Bäckerei, Schmiede, Ölkessel usw. Mauern, Türme, Torhäuser, Bergfriede, Vorratslager, Brunnen und Belagerungszelte nehmen keinen Schaden. Das Feuer selbst breitet sich wie im Originalspiel aus (dein eigenes Feuer entzündet niemals eigene Gebäude).'
oil_group: Öl-Baumeister
oil_group_details: Gilt für alle Baumeister mit Ölkesseln, auch deine eigenen. Im Originalspiel wird das Öl auf eine Stelle geschüttet und zufällig leicht versetzt; trifft es eine Mauer, Treppe, einen Turm oder ein anderes Hindernis, verpufft es völlig wirkungslos und der Baumeister läuft umsonst den ganzen Weg zurück zum Nachfüllen. Zudem bildet das Feuer unabhängig vom Gelände immer dieselbe Raute um den Treffpunkt.
oil_spread: Öl breitet sich entsprechend seiner Menge aus
oil_spread_details: 'Das Öl eines Kessels fließt über den Boden aus, auf dem es landet: Dieselbe Ölmenge bedeckt stets dieselbe Anzahl Felder und fließt nur zwischen Feldern ähnlicher Höhe, niemals eine Mauer oder steile Stufe hinauf oder hinab. Es beginnt dort, wohin der Baumeister gezielt hat – auch wenn der Kessel auf der Mauer landet, auf der er selbst steht. Auf offenem Boden entspricht das genau dem Originalspiel mit identischem Feuer, Aufflammen und Ausbreiten. In engen Durchgängen, wo es weiter fließt als ein einzelnes Feuer reicht, wirkt es wie mehrere nacheinander ausgegossene Kessel: Alle 5 Felder startet beim Eintreffen des Öls ein weiteres Feuer mit Aufflammen und Aufprallgeräusch.'
shields_enabled: Schilde begleiten die eigenen Truppen
shields_enabled_details: KI-Schilde gehen zu den Grabenaushebern, den Fernkampf-Belagerungsgeräten der Angriffsarmee (nicht denen zur eigenen Burgverteidigung) und ihren Fernkämpfern (Bogenschützen, Armbrustschützen, Steinschleuderer, berittene Bogenschützen, Feuerwerfer) – nur zu Einheiten des eigenen Spielers oder eines Verbündeten, niemals zu den Nahkämpfern der Hauptarmee. Reservetruppen erhalten erst dann Schilde, wenn keine dieser Gruppen mehr übrig ist. Die Schilde verteilen sich gleichmäßig auf die vorhandenen Gruppen (jeder neue Schild geht dorthin, wo die wenigsten stehen; ein Schild bleibt, solange sein Platz nicht mehr als seinen Anteil hat). Ist gar niemand da, hält der Schild an und wartet.
shields_group: Tragbare Schilde
shields_group_descr: KI-Schilde folgen im Originalspiel immer nur den Reservetruppen (höchstens drei Stück), und ein Schild, dessen Truppe verschwunden ist, kann am Ende jeder beliebigen Einheit hinterherlaufen, die die ID des Truppführers übernimmt – sogar einem Reh.
tags.behavior: Verhalten
tents_engineers: Baumeister erreichen immer ihr Belagerungszelt
tents_engineers_details: 'Im Originalspiel gibt ein Baumeister auf und bleibt untätig stehen, wenn der Eingang eines Belagerungszelts blockiert ist, und das Zelt erhält nie sein Gerät. Nun wird in jeder KI-Runde der Eingang jedes Zelts, dem noch Baumeister fehlen, nach Spielregel geprüft – ein blockierter Eingang wandert auf eine freie Seite – und ihm werden erneut Baumeister geschickt: zuerst jene, die aufgegeben haben oder unterwegs festhängen, dann untätige Baumeister in der Nähe (im Umkreis von 60 Feldern). Ein rundum eingemauertes Zelt wartet, bis sich ein Weg öffnet, und erhält dann seine Baumeister.'
tents_free: Sichere Zeltplätze wiederverwenden
tents_free_details: Ein Zeltplatz kann wieder genutzt werden, sobald die Truppe, die dort gebaut hat, weg ist, nichts mehr darauf steht und kein feindlicher Soldat nah genug ist, um ein Gerät dort anzugreifen (Bogenschützen, Armbrustschützen, Steinschleuderer, berittene Bogenschützen und Feuerwerfer gemäß ihrer Reichweite – auch auf Türmen – sowie Nahkämpfer innerhalb von 10 Feldern). Ballisten zählen nicht mit, da ihre enorme Reichweite fast jeden Platz ausschließen würde.
tents_group: Belagerungszelte
tents_group_details: |-
  Die KI wählt ihre Plätze für Belagerungszelte aus einer Liste, die sie für jede Burg anlegt. Im Originalspiel bleibt ein einmal benutzter Platz für den Rest des Spiels als belegt markiert, sodass in langen Partien bald alle guten Plätze aufgebraucht sind und die Zelte immer weiter weg stehen – bis die darin gebauten Triboke die Burg nicht mehr erreichen und nur noch herumstehen.

  Die beiden Schalter unten beheben das getrennt voneinander. Betrifft nur KI-Spieler.
tents_range: Zelte für Fernkampfgeräte nach Reichweite platzieren
tents_range_details: 'Zelte für Katapulte, Triboke und Feuerballisten werden dort aufgestellt, wo das Gerät die Burg erreichen kann: gemessen ab feindlichen Mauern, Türmen und Torhäusern, etwas innerhalb der Reichweite, damit auch weiter innen liegende Ziele getroffen werden. Zelte für Belagerungstürme, Rammböcke und Schilde werden wie gewohnt platziert. Findet sich kein geeigneter Platz, platziert die KI das Zelt wie bisher.'
tents_variation: Wie viel näher heran (Felder)
tents_variation_tooltip: Jedes Zelt für Fernkampfgeräte wird zwischen 0 und so vielen Feldern innerhalb der Reichweite des Geräts platziert (immer mindestens 6 Felder innerhalb der Reichweite, wegen des Zelts und der Ausfahrt des Geräts, damit selbst das entfernteste Zelt noch trifft), für jedes Zelt etwas variiert. 0 setzt jedes Zelt an den Rand der Reichweite.
towers_ai_passengers: KI-Belagerungstürme nehmen Fernkämpfer mit
towers_ai_passengers_details: Ein KI-Belagerungsturm nimmt eigene Bogenschützen, Armbrustschützen, Steinschleuderer und Feuerwerfer auf, die innerhalb von 3 Feldern um ihn herum stehen (bis zu 9), und bringt sie zur Mauer.
towers_dock: Belagerungstürme docken an mehr Mauern an
towers_dock_details: Findet das Spiel keinen Anlegeplatz, dockt ein Belagerungsturm mit einer Ecke seiner 3x3-Fläche an einer diagonalen Mauer an oder, falls auch das nicht klappt, bis zu drei Felder weiter entlang derselben Mauer. Gilt für alle Belagerungstürme, auch deine eigenen.
towers_group: Belagerungstürme
towers_group_details: Im Originalspiel kann ein Belagerungsturm nur an einem geraden Mauerstück von mindestens drei Feldern Länge mit einem freien 3x3-Feld davor andocken, und die KI schickt Türme nur an Mauern aus ihrer eigenen Liste solcher Stellen – oft spät und nie gegen Burgen ohne solche Abschnitte.
towers_orders: KI-Belagerungstürme suchen selbst eine Mauer
towers_orders_details: 'Ein untätiger KI-Belagerungsturm sucht die nächste feindliche Mauer, an der er andocken kann (innerhalb von 100 Feldern), und fährt dorthin; findet er keine, versucht er eine Mauer aus der eigenen Liste der KI. Führt auch das zu nichts – er bekommt keinen Befehl oder bleibt unterwegs stehen – oder ist eine Burg so gebaut, dass nirgends ein Turm andocken kann, begleitet er die Armee wie ein großer Schild, bis eine Mauer erreichbar wird: zuerst bei den Patrouillen, sonst beim Belagerungsschutz, sonst bei der Hauptarmee, sonst bei einer zufälligen Fernkampfgruppe der Angriffsarmee und erst wenn nichts davon übrig ist bei den Reservetruppen.'
towers_passenger_slow: Beladene Belagerungstürme sind langsamer
towers_passenger_slow_tooltip: 'Ein Belagerungsturm mit 5 oder mehr Passagieren (die Hälfte seiner 9 Plätze) fährt eine Geschwindigkeitsstufe langsamer.'
towers_passenger_lift: Passagiere höher zeichnen (Pixel)
towers_passenger_lift_tooltip: 'Beeinflusst nur die Darstellung der Passagiere: Erhöhe diesen Wert, wenn sie unter der oberen Plattform eines fahrenden Belagerungsturms zu stehen scheinen, oder verringere ihn, wenn sie darüber schweben. Ihre tatsächliche Höhe – und damit wie gut Pfeile von unten und Schwerter sie erreichen – entspricht so oder so der eines angedockten Turms.'
towers_passengers: Fußsoldaten fahren auf Belagerungstürmen mit
towers_passengers_details: 'Wähle Fußsoldaten aus und zeige auf einen deiner Belagerungstürme: Es erscheinen die Pfeile zum Bemannen eines Geräts, und ein Klick schickt sie hin. Bis zu 9 steigen oben auf und fahren mit – Bogenschützen und Armbrustschützen schießen von dort selbst während der Fahrt. Oben sind sie so sicher wie auf einem angedockten Turm: Pfeile von unten richten nur ein Drittel Schaden an und Schwerter erreichen sie nicht. Während der Fahrt sind sie nicht auswählbar. Dockt der Turm an einer Mauer an, stehen sie auf dem angedockten Turm und kämpfen von dort weiter; wird er zerstört, sterben sie mit ihm. Wähle den Turm und zeige auf ihn für die Ausstiegspfeile: Der erste Klick setzt die Passagiere rund um den Turm ab, der nächste wie gewohnt die Baumeister.'
