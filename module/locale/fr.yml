ai: IA
balance_changes: Modifications de l'équilibrage
bugfixes: Corrections de bugs
catapults_drop_destroyed: Cesser de tirer sur les bâtiments détruits
catapults_drop_destroyed_details: Un engin de siège visant un bâtiment (une baliste incendiaire sur une cible inflammable ou une catapulte dirigée sur un bâtiment) continuait de tirer sur l'emplacement vide après sa destruction sans jamais changer de cible — le jeu ne vérifiait que le numéro du bâtiment, qui reste identique tant qu'un autre bâtiment ne le réutilise pas. Désormais, une cible détruite est abandonnée et l'engin en choisit une nouvelle. Valable pour tous les engins de siège, balistes incendiaires comprises.
catapults_enabled: Les catapultes et trébuchets choisissent leurs propres cibles
catapults_enabled_details: 'Désactivé : les catapultes et trébuchets de l''IA choisissent leurs cibles exactement comme dans le jeu d''origine.'
catapults_group: Catapultes et trébuchets
catapults_on_the_way: Les catapultes et trébuchets s'arrêtent en chemin pour tirer
catapults_on_the_way_details: Dans le jeu d'origine, un engin de siège ne cherche une cible qu'à l'arrêt, si bien qu'une catapulte de l'IA en déplacement — en raid, en marche avec l'armée ou en progression vers les murs — passe devant tout ce qui est à portée. Avec cette option, une catapulte ou un trébuchet de l'IA en mouvement regarde autour de lui régulièrement et s'arrête pour tirer dès qu'un mur, une tour, une porte ou un bâtiment ennemi entre à portée, en choisissant sa cible comme ci-dessus. Nécessite l'option précédente.
catapults_other_enemies: Tirer aussi sur les autres ennemis à portée
catapults_other_enemies_details: Une catapulte ou un trébuchet de l'IA ne tire que sur le joueur qu'il assiège. Quand rien appartenant à ce joueur n'est à portée, il continue d'avancer vers son château en ignorant les murs et bâtiments d'autres ennemis. Avec cette option, il tire sur ces derniers ; les murs et bâtiments du joueur assiégé restent prioritaires dès qu'il y en a un à portée.
fixes: Correctifs
improvements: Améliorations
oil_aim: Verser l'huile uniquement sur le sol
oil_aim_details: 'Un ingénieur ne verse de l''huile que là où elle peut brûler : sur le sol dégagé, jamais sur un mur, un escalier, une tour ou un autre bâtiment. D''eux-mêmes, les ingénieurs ne versent que sur un ennemi debout sur un tel sol. Si vous l''envoyez sur une case inadaptée, l''ingénieur verse sur le sol libre le plus proche jusqu''à 4 cases de là, dans un angle d''au plus 45 degrés par rapport à la direction choisie. S''il n''y en a aucun, il garde son huile et répond « emplacement impossible », comme lorsqu''une unité ne peut pas se rendre quelque part. La marmite ne dévie plus non plus de l''endroit visé.'
oil_damage: L'huile enflammée endommage les bâtiments touchés
oil_damage_details: 'En contrepartie, les bâtiments atteints par la nappe d''huile subissent des dégâts une fois qu''elle les touche — un tiers de leurs points de vie à l''impact, et moins plus loin dans la nappe. Les vôtres aussi. Cela concerne tout bâtiment inflammable dans le jeu : masures, ateliers, fermes, moulins, grenier, armurerie, caserne, marché, écuries, guildes, chapelle, église, cathédrale, auberge, boulangerie, forgeron, marmite d''huile, etc. Les murs, tours, portes, donjons, réserves, puits et tentes de siège ne subissent aucun dégât. L''incendie se propage comme dans le jeu d''origine (votre propre feu n''enflamme jamais vos propres bâtiments).'
oil_group: Ingénieurs à l'huile
oil_spread: L'huile se répand selon sa quantité
oil_spread_details: 'L''huile d''une marmite s''écoule sur le terrain où elle tombe : la même quantité couvre toujours le même nombre de cases, en ne circulant qu''entre cases de hauteur similaire, jamais en montant ou descendant un mur ou une pente raide. Elle part du point visé par l''ingénieur, même si la marmite tombe sur le mur où il se tient. En terrain dégagé, le résultat est identique au jeu d''origine (flammes, éclat et propagation). Dans un passage étroit où la nappe s''allonge davantage, elle se comporte comme plusieurs marmites versées à la suite : toutes les 5 cases, un nouveau foyer s''allume avec son éclat et le bruit d''impact.'
shields_enabled: Les boucliers accompagnent leurs propres troupes
shields_enabled_details: Les boucliers mobiles de l'IA rejoignent les unités qui comblent les douves, les engins de siège à distance de l'armée d'attaque (pas ceux gardés à la maison) et ses troupes à distance (archers, arbalétriers, frondeurs, archers montés, lanceurs de feu) — uniquement des unités alliées ou du même joueur, jamais la mêlée de l'armée principale. Les renforts ne reçoivent de boucliers que lorsque plus aucun de ces groupes n'existe. Les boucliers sont répartis équitablement entre les groupes (chaque nouveau bouclier va là où il y en a le moins et y reste tant que sa part n'est pas dépassée). S'il n'y a personne, le bouclier s'arrête et attend.
tags.behavior: Comportement
tents_engineers: Les ingénieurs atteignent toujours leur tente
tents_engineers_details: 'Dans le jeu d''origine, un ingénieur dont l''accès à l''entrée d''une tente de siège est bloqué abandonne et reste immobile, et l''engin n''est jamais construit. Désormais, à chaque cycle de l''IA, toute tente manquant encore d''ingénieurs voit son entrée vérifiée selon la règle du jeu — une entrée bloquée est déplacée sur un côté libre — et reçoit à nouveau des ingénieurs : d''abord ceux qui avaient abandonné ou bloquaient en chemin, puis des ingénieurs inactifs proches (dans un rayon de 60 cases). Une tente entièrement murée attend qu''un passage s''ouvre puis reçoit ses ingénieurs.'
tents_free: Réutiliser les emplacements de tentes sûrs
tents_free_details: 'Un emplacement de tente peut être réutilisé dès que la troupe qui y a construit est partie, que rien ne s''y trouve plus et qu''aucun soldat ennemi n''est assez proche pour attaquer un engin là (archers, arbalétriers, frondeurs, archers montés et lanceurs de feu selon leur portée — y compris sur les tours — et tout combattant de mêlée à moins de 10 cases). Les balistes ne comptent pas : leur portée immense exclurait presque tous les emplacements.'
tents_group: Tentes de siège
tents_range: Placer les tentes d'engins à distance selon leur portée
tents_range_details: 'Les tentes de catapultes, trébuchets et balistes incendiaires sont placées là où l''engin peut atteindre le château : mesuré depuis les murs, tours et portes ennemis, légèrement en deçà de la portée pour toucher aussi l''intérieur. Les tentes de tours de siège, béliers et boucliers restent placées comme avant. S''il n''existe aucun emplacement adapté, l''IA utilise son comportement habituel.'
towers_ai_passengers: Les tours de siège de l'IA embarquent des tireurs
towers_ai_passengers_details: Une tour de siège de l'IA embarque ses propres archers, arbalétriers, frondeurs et lanceurs de feu situés dans un rayon de 3 cases (jusqu'à 9) et les transporte jusqu'au mur.
towers_dock: Les tours de siège accostent plus de murs
towers_dock_details: Si le jeu ne trouve aucun point d’accostage, la tour tente d’accoster un mur diagonal par un coin de sa base de 3 × 3 cases. Si cela échoue, elle réessaie jusqu’à trois cases plus loin le long du même mur. Cela vaut pour toutes les tours de siège, y compris les vôtres.
towers_group: Tours de siège
towers_orders: Les tours de siège de l'IA cherchent leur propre mur
towers_orders_details: 'Une tour de siège de l''IA inactive cherche le mur ennemi accostable le plus proche (dans un rayon de 100 cases) et s''y rend ; s''il n''y en a aucun, elle peut essayer un mur de la liste propre de l''IA. Si cela n''aboutit à rien — aucun ordre ou arrêt en chemin — ou si aucun mur du château n''est accostable, elle accompagne l''armée comme un grand bouclier jusqu''à ce qu''un mur soit à portée : d''abord avec les patrouilles, sinon l''escorte de siège, sinon l''armée principale, sinon une troupe à distance aléatoire de l''armée d''attaque, et en dernier recours les renforts.'
towers_passenger_slow: Les tours de siège chargées sont plus lentes
towers_passenger_slow_tooltip: 'Une tour de siège avec 5 passagers ou plus (la moitié de ses 9 places) avance d''un cran de vitesse plus lentement.'
towers_passengers: Les fantassins montent sur les tours de siège
towers_passengers_details: 'Sélectionnez des fantassins et pointez une de vos tours de siège : les flèches d''affectation apparaissent et un clic les y envoie. Jusqu''à 9 montent sur la plateforme et roulent avec elle — archers et arbalétriers tirent même pendant le déplacement. Ils y sont aussi protégés que sur une tour accostée : les flèches venant d''en bas n''infligent qu''un tiers des dégâts et les épées ne les atteignent pas. Ils ne sont pas sélectionnables pendant le trajet. Quand la tour accoste un mur, ils se tiennent dessus et continuent ; si elle est détruite, ils meurent avec elle. Sélectionnez la tour et pointez-la pour débarquer : le premier clic fait descendre les passagers autour d''elle, le second les ingénieurs comme avant.'
