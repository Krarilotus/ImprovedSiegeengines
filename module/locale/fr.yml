ai: IA
balance_changes: Modifications de l'équilibrage
bugfixes: Corrections
catapults_drop_destroyed: Cesser de tirer sur les bâtiments détruits
catapults_drop_destroyed_details: |-
  Un engin de siège visant un bâtiment (une baliste incendiaire sur une cible inflammable ou une catapulte dirigée sur un bâtiment) continuait de tirer sur l'emplacement vide après sa destruction sans jamais changer de cible — le jeu ne vérifiait que le numéro du bâtiment, qui reste identique tant qu'un autre bâtiment ne le réutilise pas. Désormais, une cible détruite est abandonnée et l'engin en choisit une nouvelle. Valable pour tous les engins de siège, balistes incendiaires comprises.

  Activé par défaut.
catapults_enabled: Les catapultes et trébuchets choisissent leurs propres cibles
catapults_enabled_details: |-
  Désactivé : les catapultes et trébuchets de l'IA choisissent leurs cibles exactement comme dans le jeu d'origine.

  Activé par défaut.
catapults_group: Catapultes et trébuchets
catapults_group_details: |-
  Dans le jeu d'origine, une catapulte de l'IA ne cherche une cible que dans une direction à la fois et uniquement parmi les murs encore intacts en hauteur. Si elle ne trouve rien, elle avance vers le château et finit — si personne ne la détruit en chemin — collée contre le mur.

  Avec cette option, une catapulte ou un trébuchet de l'IA inspecte d'abord tout autour à portée maximale pour trouver le mur, la tour ou la porte ennemis les plus proches et les bombarde depuis sa position. Les fermes, ateliers, masures et autres bâtiments civils ne sont visés que lorsqu'aucune fortification n'est à portée. Il ne s'approche que si rien du tout n'est à portée. Une fois le joueur ciblé vaincu (son seigneur est mort), il tire sur n'importe quel autre ennemi. Les balistes incendiaires le font déjà dans le jeu d'origine et ne sont pas modifiées.

  Dispersion des catapultes et trébuchets de l'IA (%) — Écart des tirs de catapultes et trébuchets de l'IA par rapport au jeu d'origine. Le jeu permet aux rochers de catapulte de tomber jusqu'à 12 cases trop court (4 trop long) et 6 de côté, et au trébuchet jusqu'à 6 de côté — à longue portée, la plupart tombent devant le mur. Sous 100, la dispersion est réduite et celle de la catapulte est centrée sur sa cible. 100 conserve la précision d'origine. Vos propres engins ne sont pas modifiés.

  Par défaut : 50.
catapults_on_the_way: Les catapultes et trébuchets s'arrêtent en chemin pour tirer
catapults_on_the_way_details: |-
  Dans le jeu d'origine, un engin de siège ne cherche une cible qu'à l'arrêt, si bien qu'une catapulte de l'IA en déplacement — en raid, en marche avec l'armée ou en progression vers les murs — passe devant tout ce qui est à portée. Avec cette option, une catapulte ou un trébuchet de l'IA en mouvement regarde autour de lui régulièrement et s'arrête pour tirer dès qu'un mur, une tour, une porte ou un bâtiment ennemi entre à portée, en choisissant sa cible comme ci-dessus. Nécessite l'option précédente.

  Activé par défaut.
catapults_other_enemies: Tirer aussi sur les autres ennemis à portée
catapults_other_enemies_details: |-
  Une catapulte ou un trébuchet de l'IA ne tire que sur le joueur qu'il assiège. Quand rien appartenant à ce joueur n'est à portée, il continue d'avancer vers son château en ignorant les murs et bâtiments d'autres ennemis. Avec cette option, il tire sur ces derniers ; les murs et bâtiments du joueur assiégé restent prioritaires dès qu'il y en a un à portée.

  Activé par défaut.
catapults_scatter: Dispersion des catapultes et trébuchets de l'IA (%)
diagnostics_group: Diagnostic
diagnostics_group_descr: Pour les tests. Écrit une ligne dans ucp3.log lorsqu'un bouclier mobile, une tour de siège ou un ingénieur de l'IA reçoit une nouvelle destination, ainsi qu'un résumé de chaque cycle de siège de l'IA (ce qu'elle a trouvé et écarté) dès qu'il change.
diagnostics_log: Journaliser les décisions de l'IA
diagnostics_log_details: |-
  À laisser désactivé en partie normale. Écrit les cycles de siège de l'IA dans ucp3.log ainsi que chaque cible choisie par une catapulte ou un trébuchet (position, case cible et contenu).

  Désactivé par défaut.
fixes: Correctifs
improvements: Améliorations
misc: Divers
oil_aim: Verser l'huile uniquement sur le sol
oil_aim_details: |-
  Un ingénieur ne verse de l'huile que là où elle peut brûler : sur le sol dégagé, jamais sur un mur, un escalier, une tour ou un autre bâtiment. D'eux-mêmes, les ingénieurs ne versent que sur un ennemi debout sur un tel sol. Si vous l'envoyez sur une case inadaptée, l'ingénieur verse sur le sol libre le plus proche jusqu'à 4 cases de là, dans un angle d'au plus 45 degrés par rapport à la direction choisie. S'il n'y en a aucun, il garde son huile et répond « emplacement impossible », comme lorsqu'une unité ne peut pas se rendre quelque part. La marmite ne dévie plus non plus de l'endroit visé.

  Activé par défaut.
oil_amount: Cases couvertes par une marmite
oil_damage: L'huile enflammée endommage les bâtiments touchés
oil_damage_details: |-
  En contrepartie, les bâtiments atteints par la nappe d'huile subissent des dégâts une fois qu'elle les touche — un tiers de leurs points de vie à l'impact, et moins plus loin dans la nappe. Les vôtres aussi. Cela concerne tout bâtiment inflammable dans le jeu : masures, ateliers, fermes, moulins, grenier, armurerie, caserne, marché, écuries, guildes, chapelle, église, cathédrale, auberge, boulangerie, forgeron, marmite d'huile, etc. Les murs, tours, portes, donjons, réserves, puits et tentes de siège ne subissent aucun dégât. L'incendie se propage comme dans le jeu d'origine (votre propre feu n'enflamme jamais vos propres bâtiments).

  Activé par défaut.
oil_group: Ingénieurs à l'huile
oil_group_details: |-
  Concerne les ingénieurs munis d'huile de tous les joueurs, y compris les vôtres. Dans le jeu d'origine, la marmite est lancée avec un léger décalage aléatoire ; si elle tombe sur un mur, un escalier, une tour ou un autre obstacle, l'huile n'a aucun effet et l'ingénieur repart se ravitailler pour rien. Et le feu forme toujours le même losange autour du point d'impact, quel que soit le terrain.

  Cases couvertes par une marmite — Nombre de cases couvertes par l'huile d'une marmite. 41 correspond à la surface couverte par le feu du jeu d'origine en terrain dégagé.

  Par défaut : 41.
oil_spread: L'huile se répand selon sa quantité
oil_spread_details: |-
  L'huile d'une marmite s'écoule sur le terrain où elle tombe : la même quantité couvre toujours le même nombre de cases, en ne circulant qu'entre cases de hauteur similaire, jamais en montant ou descendant un mur ou une pente raide. Elle part du point visé par l'ingénieur, même si la marmite tombe sur le mur où il se tient. En terrain dégagé, le résultat est identique au jeu d'origine (flammes, éclat et propagation). Dans un passage étroit où la nappe s'allonge davantage, elle se comporte comme plusieurs marmites versées à la suite : toutes les 5 cases, un nouveau foyer s'allume avec son éclat et le bruit d'impact.

  Activé par défaut.
shields_enabled: Les boucliers accompagnent leurs propres troupes
shields_enabled_details: |-
  Les boucliers mobiles de l'IA rejoignent les unités qui comblent les douves, les engins de siège à distance de l'armée d'attaque (pas ceux gardés à la maison) et ses troupes à distance (archers, arbalétriers, frondeurs, archers montés, lanceurs de feu) — uniquement des unités alliées ou du même joueur, jamais la mêlée de l'armée principale. Les renforts ne reçoivent de boucliers que lorsque plus aucun de ces groupes n'existe. Les boucliers sont répartis équitablement entre les groupes (chaque nouveau bouclier va là où il y en a le moins et y reste tant que sa part n'est pas dépassée). S'il n'y a personne, le bouclier s'arrête et attend.

  Activé par défaut.
shields_group: Boucliers mobiles
shields_group_descr: Dans le jeu d'origine, les boucliers mobiles de l'IA ne suivent que les renforts (trois au maximum), et un bouclier dont la troupe a disparu peut finir par suivre n'importe quelle unité ayant repris l'identifiant du chef — même un cerf.
tags.behavior: Comportement
tents_engineers: Les ingénieurs atteignent toujours leur tente
tents_engineers_details: |-
  Dans le jeu d'origine, un ingénieur dont l'accès à l'entrée d'une tente de siège est bloqué abandonne et reste immobile, et l'engin n'est jamais construit. Désormais, à chaque cycle de l'IA, toute tente manquant encore d'ingénieurs voit son entrée vérifiée selon la règle du jeu — une entrée bloquée est déplacée sur un côté libre — et reçoit à nouveau des ingénieurs : d'abord ceux qui avaient abandonné ou bloquaient en chemin, puis des ingénieurs inactifs proches (dans un rayon de 60 cases). Une tente entièrement murée attend qu'un passage s'ouvre puis reçoit ses ingénieurs.

  Activé par défaut.
tents_free: Réutiliser les emplacements de tentes sûrs
tents_free_details: |-
  Un emplacement de tente peut être réutilisé dès que la troupe qui y a construit est partie, que rien ne s'y trouve plus et qu'aucun soldat ennemi n'est assez proche pour attaquer un engin là (archers, arbalétriers, frondeurs, archers montés et lanceurs de feu selon leur portée — y compris sur les tours — et tout combattant de mêlée à moins de 10 cases). Les balistes ne comptent pas : leur portée immense exclurait presque tous les emplacements.

  Activé par défaut.
tents_group: Tentes de siège
tents_group_details: |-
  L'IA choisit l'emplacement de ses tentes de siège dans une liste calculée pour chaque château. Dans le jeu d'origine, un emplacement utilisé une fois reste marqué comme occupé pour toute la partie, si bien que dans les parties longues tous les bons emplacements disparaissent et les tentes reculent sans cesse — jusqu'à ce que les trébuchets ne puissent plus atteindre le château et restent inactifs.

  Les deux options ci-dessous corrigent cela séparément. Seuls les joueurs IA sont concernés.

  Rapprochement maximal (cases) — Chaque tente d'engin à distance est placée entre 0 et ce nombre de cases en deçà de la portée de l'engin (toujours au moins 6 cases à l'intérieur de la portée pour la tente et la sortie de l'engin, afin que même la tente la plus éloignée puisse tirer), avec une légère variation par tente. 0 place chaque tente en limite de portée.

  Par défaut : 10.
tents_range: Placer les tentes d'engins à distance selon leur portée
tents_range_details: |-
  Les tentes de catapultes, trébuchets et balistes incendiaires sont placées là où l'engin peut atteindre le château : mesuré depuis les murs, tours et portes ennemis, légèrement en deçà de la portée pour toucher aussi l'intérieur. Les tentes de tours de siège, béliers et boucliers restent placées comme avant. S'il n'existe aucun emplacement adapté, l'IA utilise son comportement habituel.

  Activé par défaut.
tents_variation: Rapprochement maximal (cases)
towers_ai_passengers: Les tours de siège de l'IA embarquent des tireurs
towers_ai_passengers_details: |-
  Une tour de siège de l'IA embarque ses propres archers, arbalétriers, frondeurs et lanceurs de feu situés dans un rayon de 3 cases (jusqu'à 9) et les transporte jusqu'au mur.

  Activé par défaut.
towers_dock: Les tours de siège accostent plus de murs
towers_dock_details: |-
  Lorsque le jeu ne trouve aucun point d'accostage, une tour accoste par le coin de son emprise 3x3 contre un mur diagonal, ou sinon jusqu'à trois cases plus loin le long du même mur. Cela vaut pour toutes les tours de siège, y compris les vôtres. Cette fonction appartenait autrefois à Smarter Walls, qui ne la gère plus à partir de la version 1.0.16.

  Activé par défaut.
towers_group: Tours de siège
towers_group_details: |-
  Dans le jeu d'origine, une tour de siège ne peut accoster qu'un mur droit d'au moins trois cases de long avec un carré 3x3 dégagé devant, et l'IA n'envoie des tours que sur sa propre liste de tels emplacements — souvent tard, et jamais contre un château qui n'en possède pas.

  Décalage vertical des passagers (pixels) — Affecte uniquement l'affichage des passagers : augmentez cette valeur s'ils semblent enfoncés sous la plateforme d'une tour en mouvement, réduisez-la s'ils flottent au-dessus. Leur hauteur réelle — et donc la façon dont les flèches d'en bas et les épées les atteignent — reste dans tous les cas celle d'une tour accostée.

  Par défaut : 4.
towers_orders: Les tours de siège de l'IA cherchent leur propre mur
towers_orders_details: |-
  Une tour de siège de l'IA inactive cherche le mur ennemi accostable le plus proche (dans un rayon de 100 cases) et s'y rend ; s'il n'y en a aucun, elle peut essayer un mur de la liste propre de l'IA. Si cela n'aboutit à rien — aucun ordre ou arrêt en chemin — ou si aucun mur du château n'est accostable, elle accompagne l'armée comme un grand bouclier jusqu'à ce qu'un mur soit à portée : d'abord avec les patrouilles, sinon l'escorte de siège, sinon l'armée principale, sinon une troupe à distance aléatoire de l'armée d'attaque, et en dernier recours les renforts.

  Activé par défaut.
towers_passenger_lift: Décalage vertical des passagers (pixels)
towers_passengers: Les fantassins montent sur les tours de siège
towers_passengers_details: |-
  Sélectionnez des fantassins et pointez une de vos tours de siège : les flèches d'affectation apparaissent et un clic les y envoie. Jusqu'à 9 montent sur la plateforme et roulent avec elle — archers et arbalétriers tirent même pendant le déplacement. Ils y sont aussi protégés que sur une tour accostée : les flèches venant d'en bas n'infligent qu'un tiers des dégâts et les épées ne les atteignent pas. Ils ne sont pas sélectionnables pendant le trajet. Quand la tour accoste un mur, ils se tiennent dessus et continuent ; si elle est détruite, ils meurent avec elle. Sélectionnez la tour et pointez-la pour débarquer : le premier clic fait descendre les passagers autour d'elle, le second les ingénieurs comme avant.

  Activé par défaut.
