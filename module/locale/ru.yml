ai: ИИ
balance_changes: Изменения баланса
bugfixes: Исправления
catapults_drop_destroyed: Прекращать обстрел разрушенных зданий
catapults_drop_destroyed_details: Осадное орудие, нацеленное на здание (огненная баллиста по горючей постройке или катапульта по приказу), продолжало стрелять по пустому месту после его разрушения и не переключалось — игра проверяла лишь номер здания, который сохраняется, пока его не займёт новая постройка. Теперь разрушенная цель сбрасывается, и орудие ищет новую. Работает для всех осадных орудий, включая огненные баллисты.
catapults_enabled: Катапульты и требюше сами выбирают цели
catapults_enabled_details: 'Отключено: катапульты и требюше ИИ выбирают цели точно так же, как в оригинальной игре.'
catapults_group: Катапульты и требюше
catapults_group_details: |-
  В оригинальной игре катапульта ИИ ищет цель только в одном направлении за раз и лишь среди ещё не разрушенных высоких стен. Ничего не найдя, она едет дальше к замку и, если её не уничтожат по пути, оказывается прямо перед стеной.

  С этой опцией катапульта или требюше ИИ сначала осматривается вокруг на всю дальность стрельбы, находит ближайшую вражескую стену, башню или ворота и ведёт огонь с места. Фермы, мастерские, дома и другие гражданские постройки обстреливаются только когда в радиусе не осталось укреплений. Орудие подъезжает ближе лишь когда в досягаемости совсем ничего нет. После поражения целевого игрока (смерти его лорда) оно стреляет по любому другому врагу. Огненные баллисты уже ведут себя так в оригинале и не изменяются.
catapults_on_the_way: Катапульты и требюше останавливаются в пути для стрельбы
catapults_on_the_way_details: В оригинальной игре осадное орудие ищет цель только стоя на месте, поэтому катапульта ИИ в движении — в налёте, на марше армии или при подходе к стенам — проезжает мимо всего в радиусе стрельбы. С этой опцией движущаяся катапульта или требюше ИИ каждые несколько мгновений осматривается вокруг и сразу останавливается для стрельбы, заметив вражескую стену, башню, ворота или здание, выбирая цель как описано выше. Требует включения настройки выше.
catapults_other_enemies: Стрелять также по другим врагам в досягаемости
catapults_other_enemies_details: Катапульта или требюше ИИ стреляет только по игроку, которого осаждает. Когда ничего от этого игрока нет в радиусе, оно катится к его замку мимо стен и зданий других врагов. С этой опцией орудие обстреливает их; стены и здания осаждаемого игрока по-прежнему в приоритете, как только попадают в радиус.
catapults_scatter: Разброс катапульт и требюше ИИ (%)
catapults_scatter_tooltip: Насколько сильно промахиваются катапульты и требюше ИИ по сравнению с оригиналом. При значениях ниже 100 разброс уменьшается, а у катапульт центрируется на цели. 100 сохраняет точность оригинала. Ваши орудия не меняются.
diagnostics_group: Диагностика
diagnostics_group_descr: Для тестирования. Записывает строку в ucp3.log, когда щит, осадная башня или инженер ИИ получает новую цель, а также сводку каждого осадного цикла ИИ (что найдено и что пропущено) при его изменении.
diagnostics_log: Записывать решения ИИ в журнал
diagnostics_log_details: Отключено для обычной игры. Записывает в ucp3.log осадные циклы ИИ и каждую выбранную катапультой или требюше цель (позицию орудия, целевую клетку и что на ней находится).
fixes: Исправления
improvements: Улучшения
misc: Разное
oil_aim: Лить масло только на землю
oil_aim_details: 'Инженер льёт масло только туда, где оно может гореть: на открытую землю, а не на стену, лестницу, башню или здание. Самостоятельно инженеры льют только на врагов, стоящих на такой земле. Если вы укажете неподходящую клетку, инженер выльет масло на ближайшую подходящую клетку в пределах 4 клеток и не далее 45 градусов от направления к вашей точке. Если такой нет, он сохраняет масло и говорит «невозможное место» (как при недостижимой точке). Котёл также больше не смещается в сторону от цели.'
oil_amount: Клеток, покрываемых одним котлом
oil_amount_tooltip: Сколько клеток покрывает масло из одного котла. 41 соответствует площади огня на открытой земле в оригинальной игре.
oil_damage: Горящее масло повреждает задетые здания
oil_damage_details: 'Обратная сторона: здания, до которых дотекает масло, однократно получают урон — треть запаса прочности в точке попадания и меньше дальше по разливу. Ваши здания тоже. Это касается всех горючих зданий в игре: хижин, мастерских, ферм, мельниц, амбаров, оружейных, казарм, рынков, конюшен, гильдий, часовен, церквей, соборов, трактиров, пекарен, кузниц, котлов с маслом и т. д. Стены, башни, ворота, цитадели, склады, колодцы и осадные палатки не повреждаются. Сам огонь распространяется как в оригинале (ваш огонь никогда не поджигает ваши здания).'
oil_group: Инженеры с маслом
oil_group_details: Для всех инженеров с котлами масла, включая ваших. В оригинальной игре котёл выливается с небольшим случайным смещением; если он попадает на стену, лестницу, башню или другое препятствие, масло пропадает впустую, и инженер зря идёт за новым. При этом огонь всегда образует одинаковый ромб независимо от местности.
oil_spread: Масло растекается соответственно своему объёму
oil_spread_details: 'Масло из котла растекается по земле, на которую попало: один и тот же объём покрывает одинаковое число клеток и течёт лишь между клетками близкой высоты, никогда не поднимаясь и не спускаясь по стене или крутому уступу. Разлив начинается там, куда целился инженер — даже если котёл упал на стену, где он стоит. На открытой земле это в точности оригинальный разлив с тем же огнём и вспышкой. В узком проходе, где масло утекает дальше обычного радиуса огня, оно выглядит как несколько котлов подряд: каждые 5 клеток по мере растекания вспыхивает новый очаг со звуком удара.'
shields_enabled: Щиты сопровождают свои войска
shields_enabled_details: Переносные щиты ИИ направляются к засыпающим ров, к дальнобойным осадным орудиям атакующей армии (не к оставшимся дома) и к её стрелкам (лучникам, арбалетчикам, пращникам, конным лучникам, огнеметателям) — только к своим или союзным отрядам, никогда к ближнему бою основной армии. Резервные войска получают щиты лишь когда никого из перечисленных не осталось. Щиты распределяются равномерно (каждый новый идёт туда, где их меньше всего, и остаётся там, пока доля не превышена). Если прикрывать некого, щит останавливается и ждёт.
shields_group: Переносные щиты
shields_group_descr: В оригинальной игре переносные щиты ИИ следуют только за резервными войсками (не более трёх), а щит, потерявший свой отряд, может пойти за любым юнитом, занявшим слот командира отряда — даже за оленем.
tags.behavior: Поведение
tents_engineers: Инженеры всегда добираются до своей палатки
tents_engineers_details: 'В оригинальной игре инженер, которому перекрыт вход в осадную палатку, сдаётся и стоит без дела, а палатка так и не строит орудие. Теперь каждый цикл ИИ проверяет вход палатки без инженеров по правилам игры — заблокированный вход переносится на свободную сторону — и снова направляет к ней инженеров: сначала тех, кто бросил её или застрял в пути, затем свободных инженеров поблизости (в радиусе 60 клеток). Полностью замурованная палатка ждёт, пока откроется путь, и затем получает инженеров.'
tents_free: Повторно использовать безопасные места для палаток
tents_free_details: 'Место под палатку снова становится доступным, когда строивший там отряд ушёл, клетка пуста и поблизости нет вражеского солдата, способного атаковать там орудие (лучников, арбалетчиков, пращников, конных лучников и огнеметателей в пределах их дальности — включая стоящих на башнях — и любых бойцов ближнего боя в пределах 10 клеток). Баллисты не учитываются: их огромная дальность исключила бы почти все места.'
tents_group: Осадные палатки
tents_group_details: |-
  ИИ выбирает места для осадных палаток из списка, рассчитанного для каждого замка. В оригинальной игре раз использованное место остаётся занятым до конца партии, поэтому в долгих играх все удачные точки кончаются, и палатки ставятся всё дальше — пока требюше не перестают доставать до замка и просто стоят.

  Два переключателя ниже решают эту проблему раздельно. Затрагивает только игроков ИИ.
tents_range: Ставить палатки дальнобойных орудий по дальности
tents_range_details: 'Палатки катапульт, требюше и огненных баллист ставятся там, откуда орудие достаёт до замка: отсчитывая от вражеских стен, башен и ворот чуть ближе максимальной дальности, чтобы доставать и цели внутри замка. Палатки осадных башен, таранов и щитов ставятся как прежде. Если подходящего места нет, ИИ ставит палатку по-старому.'
tents_variation: Насколько ближе к замку (клеток)
tents_variation_tooltip: Палатка каждого дальнобойного орудия ставится на расстоянии от 0 до этого числа клеток ближе его максимальной дальности (всегда минимум на 6 клеток внутри дальности с учётом палатки и выезда орудия, чтобы доставало даже самое дальнее), с небольшим разбросом для каждой палатки. 0 ставит палатки на границе дальности.
towers_ai_passengers: Осадные башни ИИ берут на борт стрелков
towers_ai_passengers_details: Осадная башня ИИ сажает на себя своих лучников, арбалетчиков, пращников и огнеметателей, стоящих в пределах 3 клеток (до 9 воинов), и везёт их к стене.
towers_dock: Осадные башни стыкуются с большим числом стен
towers_dock_details: Если игра не находит места стыковки, башня примыкает углом своего квадрата 3x3 к диагональной стене, а если и это не выходит — к той же стене со смещением до трёх клеток. Работает для всех осадных башен, включая ваши.
towers_group: Осадные башни
towers_group_details: В оригинальной игре осадная башня может примкнуть только к прямому участку стены длиной не менее трёх клеток со свободным квадратом 3x3 перед ним, а ИИ посылает башни только к стенам из собственного списка таких мест — часто поздно и никогда к замкам без них.
towers_orders: Осадные башни ИИ сами находят стену
towers_orders_details: 'Бездействующая осадная башня ИИ ищет ближайшую вражескую стену, к которой может примкнуть (в радиусе 100 клеток), и едет туда; если таких нет, пробует стену из списка ИИ. Если и это не помогает — нет приказа, путь заблокирован или к замку вообще нельзя примкнуть — башня сопровождает армию как большой щит, пока стена не окажется в досягаемости: сначала с патрулями, затем с осадным прикрытием, основной армией, случайным отрядом стрелков и в последнюю очередь с резервными войсками.'
towers_passenger_slow: Нагруженные осадные башни медленнее
towers_passenger_slow_tooltip: 'Осадная башня с 5 и более пассажирами (половина из 9 мест) движется на одну ступень скорости медленнее.'
towers_passenger_lift: Смещение отрисовки пассажиров вверх (пикселей)
towers_passenger_lift_tooltip: 'Меняет только отображение пассажиров: увеличьте значение, если они выглядят ниже верхней площадки движущейся башни, или уменьшите, если парят над ней. Их реальная высота — и защита от стрел снизу и мечей — в любом случае соответствует пристыкованной башне.'
towers_passengers: Пехота может ехать на осадных башнях
towers_passengers_details: 'Выделите пехотинцев и наведите курсор на свою осадную башню: появятся стрелки посадки, и щелчок отправит их к ней. До 9 воинов поднимутся наверх и поедут вместе с башней — лучники и арбалетчики ведут огонь прямо на ходу. Наверху они защищены так же, как на пристыкованной башне: стрелы снизу наносят треть урона, а мечи их не достают. Во время движения их нельзя выделить. Когда башня стыкуется со стеной, они оказываются наверху и действуют дальше; при уничтожении башни гибнут вместе с ней. Выделите башню и наведите на неё для высадки: первый щелчок спускает пассажиров вокруг башни, второй — инженеров, как обычно.'
