ai: هوش مصنوعی
balance_changes: تغییرات توازن
bugfixes: رفع اشکال
catapults_drop_destroyed: توقف شلیک به ساختمان‌های ویران‌شده
catapults_drop_destroyed_details: ابزار محاصره‌ای که به یک ساختمان شلیک می‌کرد (بالیستای آتشین به یک بنای آتش‌گیر یا منجنیقی که به ساختمان فرمان گرفته) پس از نابودی آن همچنان به جای خالی شلیک می‌کرد و هرگز هدف عوض نمی‌کرد — بازی فقط شمارهٔ ساختمان را بررسی می‌کرد که تا ساخت بنای جدید در آن خانه ثابت می‌ماند. اکنون هدف ویران‌شده رها می‌شود و ابزار هدف تازه‌ای می‌یابد. برای همهٔ ادوات محاصره از جمله بالیستاهای آتشین کار می‌کند.
catapults_enabled: منجنیق‌ها و تریبوشت‌ها خودشان هدف انتخاب می‌کنند
catapults_enabled_details: 'خاموش: منجنیق‌ها و تریبوشت‌های هوش مصنوعی دقیقاً مانند بازی اصلی هدف انتخاب می‌کنند.'
catapults_group: منجنیق‌ها و تریبوشت‌ها
catapults_group_details: |-
  در بازی اصلی یک منجنیق هوش مصنوعی در هر لحظه فقط یک جهت را می‌گردد و فقط دیوارهای هنوز بلند را می‌بیند. وقتی چیزی پیدا نکند به سمت قلعه جلو می‌رود و اگر در راه نابود نشود درست کنار دیوار می‌ایستد.

  با روشن بودن این گزینه، منجنیق یا تریبوشت هوش مصنوعی ابتدا تمام اطراف خود را تا بیشترین برد بررسی می‌کند و نزدیک‌ترین دیوار، برج یا دروازهٔ دشمن را از همان جا می‌زند. مزارع، کارگاه‌ها، کلبه‌ها و سایر بناهای غیرنظامی فقط وقتی هدف قرار می‌گیرند که هیچ استحکاماتی در برد نباشد. تنها وقتی واقعاً چیزی در برد نباشد جلوتر می‌رود. پس از شکست بازیکن هدف (مرگ لرد او)، به هر دشمن دیگری شلیک می‌کند. بالیستاهای آتشین در بازی اصلی نیز چنین رفتاری دارند و تغییر نمی‌کنند.
catapults_on_the_way: منجنیق‌ها و تریبوشت‌ها در راه برای شلیک متوقف می‌شوند
catapults_on_the_way_details: در بازی اصلی یک ابزار محاصره فقط هنگام ایستادن دنبال هدف می‌گردد، پس منجنیق هوش مصنوعی در حال حرکت — در یورش، رژهٔ ارتش یا نزدیک شدن به دیوارها — از کنار همهٔ اهداف در برد می‌گذرد. با این گزینه، منجنیق یا تریبوشت در حال حرکت هوش مصنوعی هر چند لحظه اطراف را بررسی می‌کند و به‌محض ورود دیوار، برج، دروازه یا ساختمان دشمن به بردش می‌ایستد و با اولویت بالا شلیک می‌کند. نیازمند روشن بودن گزینهٔ بالاست.
catapults_other_enemies: شلیک به سایر دشمنان در برد
catapults_other_enemies_details: منجنیق یا تریبوشت هوش مصنوعی فقط به بازیکنی که محاصره کرده شلیک می‌کند. وقتی چیزی از آن بازیکن در برد نباشد، از کنار دیوارها و ساختمان‌های دشمنان دیگر رد می‌شود. با روشن بودن این گزینه به آن‌ها هم شلیک می‌کند؛ با این حال دیوارها و ساختمان‌های بازیکن محاصره‌شده هرگاه در برد باشند همچنان در اولویت‌اند.
catapults_scatter: پراکندگی شلیک منجنیق و تریبوشت هوش مصنوعی (٪)
catapults_scatter_tooltip: میزان خطای شلیک منجنیق‌ها و تریبوشت‌های هوش مصنوعی نسبت به بازی اصلی. زیر 100 میزان خطا کاهش می‌یابد و خطای منجنیق حول هدف متمرکز می‌شود. مقدار 100 دقت اصلی بازی را حفظ می‌کند. ادوات خود شما تغییر نمی‌کنند.
diagnostics_group: عیب‌یابی
diagnostics_group_descr: برای آزمایش. هرگاه سپر متحرک، برج محاصره یا مهندس هوش مصنوعی مقصد جدیدی بگیرد یک خط در ucp3.log ثبت می‌کند و هنگام تغییر هر نوبت محاصرهٔ هوش مصنوعی خلاصهٔ آن (موارد یافت‌شده و رهاشده) را می‌نویسد.
diagnostics_log: ثبت تصمیم‌های هوش مصنوعی در گزارش
diagnostics_log_details: برای بازی عادی خاموش باشد. نوبت‌های محاصرهٔ هوش مصنوعی و هر هدفی را که منجنیق یا تریبوشت انتخاب می‌کند (موقعیت ابزار، خانهٔ هدف و آنچه در آن است) در ucp3.log ثبت می‌کند.
fixes: رفع اشکال
improvements: بهبودها
misc: سایر
oil_aim: ریختن روغن فقط روی زمین باز
oil_aim_details: 'مهندس فقط جایی روغن می‌ریزد که روغن سوزان بتواند بماند: زمین باز، نه روی دیوار، پله، برج یا ساختمان دیگر. مهندسان به‌طور خودکار فقط روی دشمنانی که روی چنین زمینی ایستاده‌اند روغن می‌ریزند. اگر او را به نقطه‌ای نامناسب بفرستید، روی نزدیک‌ترین زمین مناسب تا فاصلهٔ 4 خانه و حداکثر 45 درجه انحراف از خط دید شما می‌ریزد. اگر نباشد روغن را نگه می‌دارد و پیام «مکان غیرممکن» می‌دهد (همانند زمانی که نیرو نمی‌تواند به جایی برود). دیگ روغن دیگر از نقطهٔ هدف منحرف نمی‌شود.'
oil_amount: تعداد خانه‌هایی که یک دیگ روغن پوشش می‌دهد
oil_amount_tooltip: روغن یک دیگ چند خانه را می‌پوشاند. عدد 41 برابر مساحت آتش بازی اصلی در زمین باز است.
oil_damage: روغن سوزان به ساختمان‌های برخوردی آسیب می‌زند
oil_damage_details: 'نکتهٔ متقابل: ساختمان‌هایی که روغن به آن‌ها می‌رسد یک بار آسیب می‌بینند — یک‌سوم سلامتی آن‌ها دقیقاً در محل فرود دیگ و کمتر در بخش‌های دورتر جریان روغن، از جمله ساختمان‌های خودتان. این شامل همهٔ بناهای قابل اشتعال بازی است: کلبه‌ها، کارگاه‌ها، مزارع، آسیاب‌ها، انبار غله، اسلحه‌خانه، سربازخانه، بازار، اصطبل‌ها، صنف‌ها، نمازخانه، کلیسا، کلیسای جامع، میخانه، نانوایی، آهنگری، دیگ روغن و مانند آن. دیوارها، برج‌ها، دروازه‌ها، دژهای مرکزی، انبار کالا، چاه‌ها و چادرهای محاصره آسیب نمی‌بینند. گسترش آتش مانند بازی اصلی است (آتش خودتان هرگز ساختمان‌های خودتان را آتش نمی‌زند).'
oil_group: مهندسان روغن‌ریز
oil_group_details: برای همهٔ مهندسان دارای دیگ روغن، از جمله مهندسان شما. در بازی اصلی دیگ با کمی خطای تصادفی ریخته می‌شود؛ اگر روی دیوار، پله، برج یا مانع دیگری بیفتد هیچ اثری ندارد و مهندس بی‌فایده برای پر کردن برمی‌گردد. همچنین آتش بدون توجه به زمین همیشه یک لوزی یکسان می‌سازد.
oil_spread: پخش شدن روغن متناسب با مقدار آن
oil_spread_details: 'روغن یک دیگ روی زمینی که فرود می‌آید جاری می‌شود: مقدار یکسان روغن همیشه تعداد خانه‌های یکسانی را می‌پوشاند و تنها بین خانه‌های هم‌ارتفاع جریان می‌یابد و هرگز از دیوار یا پلهٔ تند بالا و پایین نمی‌رود. از همان نقطه‌ای که مهندس نشانه گرفته آغاز می‌شود — حتی اگر دیگ روی دیواری بیفتد که خودش ایستاده است. در زمین باز دقیقاً مثل بازی اصلی است (همان آتش، شعله و گسترش). در گذرگاه باریک که بیشتر کشیده می‌شود، مانند چند دیگ پی‌درپی عمل می‌کند: هر 5 خانه آتش جدیدی همراه با شعله و صدای برخورد آغاز می‌شود.'
shields_enabled: سپرها همراه نیروهای خودشان حرکت می‌کنند
shields_enabled_details: سپرهای متحرک هوش مصنوعی کنار نیروهای پرکنندهٔ خندق، ادوات محاصرهٔ دوربرد ارتش تهاجمی (نه آن‌هایی که در خانه نگه داشته) و نیروهای دورزن آن (کمانداران، کمانداران زنبورکی، فلاخن‌اندازان، کمانداران سواره، آتش‌اندازان) می‌روند — فقط کنار واحدهای خودی یا متحد، هرگز کنار پیاده‌نظام نزدیک‌زن ارتش اصلی. نیروهای ذخیره تنها وقتی سپر می‌گیرند که هیچ‌یک از گروه‌های بالا نمانده باشند. سپرها به‌طور مساوی توزیع می‌شوند و اگر کسی نباشد سپر می‌ایستد و منتظر می‌ماند.
shields_group: سپرهای متحرک
shields_group_descr: در بازی اصلی سپرهای متحرک هوش مصنوعی فقط دنبال نیروهای ذخیره (حداکثر سه عدد) می‌روند و سپری که دسته‌اش از بین رفته ممکن است دنبال هر واحدی برود که جای فرماندهٔ آن دسته را گرفته — حتی یک گوزن.
tags.behavior: رفتار
tents_engineers: مهندسان همیشه وارد چادر خود می‌شوند
tents_engineers_details: 'در بازی اصلی مهندسی که راهش به ورودی چادر محاصره بسته باشد منصرف می‌شود و بیکار می‌ایستد و چادر هرگز ساخته نمی‌شود. اکنون در هر نوبت هوش مصنوعی ورودی چادرهای بدون مهندس به روش خود بازی بررسی می‌شود — ورودی بسته به سمت آزاد جابه‌جا می‌شود — و مهندسان دوباره فرستاده می‌شوند: ابتدا آن‌هایی که منصرف شده یا در راه گیر کرده‌اند و سپس مهندسان بیکار نزدیک (تا 60 خانه). چادری که از همه طرف محصور باشد صبر می‌کند تا راهی باز شود و سپس مهندسانش را می‌گیرد.'
tents_free: استفادهٔ مجدد از جاهای امن چادر
tents_free_details: جای چادر پس از رفتن دستهٔ سازنده، خالی شدن محل و نبودن سرباز دشمن در فاصلهٔ تهدید (کمانداران، کمانداران زنبورکی، فلاخن‌اندازان، کمانداران سواره و آتش‌اندازان در بردشان — حتی روی برج‌ها — و هر شمشیرزن یا نیزه‌دار تا 10 خانه) دوباره قابل استفاده می‌شود. بالیستاها حساب نمی‌شوند زیرا برد زیادشان تقریباً همهٔ نقاط را حذف می‌کرد.
tents_group: چادرهای محاصره
tents_group_details: |-
  هوش مصنوعی جای چادرهای محاصره را از فهرستی که برای هر قلعه محاسبه می‌کند برمی‌گزیند. در بازی اصلی هر نقطه‌ای که یک بار استفاده شود تا پایان بازی اشغال‌شده باقی می‌ماند، در نتیجه در بازی‌های طولانی همهٔ نقاط خوب تمام می‌شوند و چادرها آن‌قدر دور می‌روند که تریبوشت‌ها به قلعه نمی‌رسند و بیکار می‌مانند.

  دو کلید زیر این مشکل را جداگانه برطرف می‌کنند. فقط بازیکنان هوش مصنوعی را تحت تأثیر قرار می‌دهد.
tents_range: قرار دادن چادر ادوات دوربرد بر اساس برد
tents_range_details: 'چادر منجنیق‌ها، تریبوشت‌ها و بالیستاهای آتشین جایی قرار می‌گیرد که ابزار به قلعه برسد: اندکی داخل برد نسبت به دیوارها، برج‌ها و دروازه‌های دشمن تا بتواند اهداف درونی‌تر را نیز بزند. چادر برج‌های محاصره، دژکوب‌ها و سپرها مانند قبل قرار می‌گیرد. اگر چنین نقطه‌ای نباشد، هوش مصنوعی به روش همیشگی عمل می‌کند.'
tents_variation: چقدر نزدیک‌تر (خانه)
tents_variation_tooltip: چادر هر ابزار دوربرد بین 0 تا این تعداد خانه داخل برد ابزار قرار می‌گیرد (همیشه دست‌کم 6 خانه درون برد برای جای چادر و خروج ابزار تا دورترین چادر هم برسد) و برای هر چادر کمی متفاوت است. مقدار 0 همهٔ چادرها را لب مرز برد قرار می‌دهد.
towers_ai_passengers: برج‌های محاصرهٔ هوش مصنوعی نیروهای دورزن را سوار می‌کنند
towers_ai_passengers_details: برج محاصرهٔ هوش مصنوعی کمانداران، کمانداران زنبورکی، فلاخن‌اندازان و آتش‌اندازان خودی را که تا 3 خانه نزدیکش باشند (حداکثر 9 نفر) سوار می‌کند و تا پای دیوار می‌برد.
towers_dock: اتصال برج‌های محاصره به دیوارهای بیشتر
towers_dock_details: هنگامی که بازی جای اتصالی پیدا نکند، برج با گوشهٔ مربع 3x3 خود به دیوار مورب متصل می‌شود و اگر آن هم نشد تا سه خانه آن‌سوتر روی همان دیوار می‌نشیند. برای همهٔ برج‌های محاصره از جمله برج‌های شما کار می‌کند.
towers_group: برج‌های محاصره
towers_group_details: در بازی اصلی یک برج محاصره فقط به قطعه دیوار صافی به طول دست‌کم سه خانه با فضای آزاد 3x3 در جلویش متصل می‌شود، و هوش مصنوعی فقط برج‌ها را به دیوارهای فهرست خودش می‌فرستد — اغلب دیر و هرگز به قلعه‌هایی که چنین دیواری ندارند.
towers_orders: برج‌های محاصرهٔ هوش مصنوعی خودشان دیوار پیدا می‌کنند
towers_orders_details: 'برج محاصرهٔ بیکار هوش مصنوعی نزدیک‌ترین دیوار دشمن قابل اتصال (تا 100 خانه) را پیدا کرده و به سوی آن می‌رود؛ اگر نباشد دیواری از فهرست هوش مصنوعی را امتحان می‌کند. اگر آن هم نتیجه نداد — فرمانی نگرفت، در راه ماند یا قلعه هیچ نقطهٔ اتصالی نداشت — مانند یک سپر بزرگ همراه ارتش حرکت می‌کند تا دیواری در دسترس قرار گیرد: ابتدا با گشت‌ها، سپس محافظان محاصره، ارتش اصلی، یک دستهٔ دورزن تصادفی و در نهایت نیروهای ذخیره.'
towers_passenger_lift: بالاتر کشیدن مسافران (پیکسل)
towers_passenger_lift_tooltip: 'فقط محل نمایش مسافران را تنظیم می‌کند: اگر روی برج در حال حرکت پایین‌تر از عرشهٔ بالا دیده می‌شوند آن را بالا ببرید و اگر شناورند کم کنید. ارتفاع واقعی آن‌ها — و میزان آسیب تیر از پایین و شمشیر — در هر حال مانند برج متصل‌شده است.'
towers_passengers: پیاده‌نظام سوار برج‌های محاصره می‌شود
towers_passengers_details: 'سربازان پیاده را انتخاب کنید و روی یکی از برج‌های محاصرهٔ خود اشاره کنید: پیکان‌های سوار شدن ظاهر می‌شوند و با یک کلیک به سویش می‌روند. تا 9 نفر روی آن بالا می‌روند و همراه برج حرکت می‌کنند — کمانداران و کمانداران زنبورکی حتی حین حرکت تیر می‌زنند. آن بالا به اندازهٔ برج متصل‌شده ایمن‌اند: تیرهای پایین یک‌سوم آسیب می‌زنند و شمشیر به آن‌ها نمی‌رسد. حین حرکت قابل انتخاب نیستند. وقتی برج به دیوار متصل شود روی آن می‌مانند و ادامه می‌دهند؛ با نابودی برج آن‌ها هم کشته می‌شوند. برج را انتخاب و به آن اشاره کنید: کلیک اول مسافران را پیاده می‌کند و کلیک دوم مانند قبل مهندسان را.'
