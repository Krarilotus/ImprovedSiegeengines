ai: Yapay zekâ
balance_changes: Denge değişiklikleri
bugfixes: Hata düzeltmeleri
catapults_drop_destroyed: Yıkılan binalara ateş etmeyi bırak
catapults_drop_destroyed_details: Bir binaya nişan alan kuşatma aracı (yanan bir yapıya ateş eden ateş balistası veya bir binaya yönlendirilen mancınık), bina yıkıldıktan sonra da boş yere ateş etmeye devam ediyor ve asla yeni hedefe geçmiyordu — oyun yalnızca başka bir bina alana dek sabit kalan bina numarasını kontrol ediyordu. Artık yıkılan hedef bırakılır ve araç yeni bir hedef arar. Ateş balistaları dâhil tüm kuşatma araçları için geçerlidir.
catapults_enabled: Mancınıklar ve trebuşeler kendi hedeflerini seçer
catapults_enabled_details: 'Kapalı: yapay zekâ mancınıkları ve trebuşeleri hedeflerini değiştirilmemiş oyundaki gibi seçer.'
catapults_group: Mancınıklar ve trebuşeler
catapults_group_details: |-
  Değiştirilmemiş oyunda bir yapay zekâ mancınığı her seferinde yalnızca bir yöne bakar ve sadece hâlâ sağlam duran yüksek surları hedef alır. Hiçbir şey bulamazsa kaleye doğru ilerler ve yolda vurulmazsa surun hemen dibine kadar gelir.

  Bu ayar açıkken bir yapay zekâ mancınığı veya trebuşesi önce tam menzili içinde her yöne bakarak en yakın düşman surunu, kulesini veya kapı binasını bulur ve durduğu yerden ateş eder. Çiftlikler, atölyeler, kulübeler ve diğer sivil binalar yalnızca menzilde hiçbir tahkimat kalmadığında hedef alınır. Yalnızca menzilde gerçekten hiçbir şey yoksa daha yakına ilerler. Hedef alınan oyuncu yenildiğinde (lordu öldüğünde) menzildeki başka herhangi bir düşmana ateş eder. Ateş balistaları oyunda zaten böyle davrandığından değiştirilmez.
catapults_on_the_way: Mancınıklar ve trebuşeler yolda durup ateş eder
catapults_on_the_way_details: Değiştirilmemiş oyunda bir kuşatma aracı yalnızca dururken hedef arar; bu yüzden hareket hâlindeki bir yapay zekâ mancınığı — akında, ordu yürüyüşünde veya surlara yaklaşırken — menzilindeki her şeyin yanından geçip gider. Bu ayarla yürüyen bir yapay zekâ mancınığı veya trebuşesi birkaç saniyede bir etrafına bakar ve menzile düşman suru, kulesi, kapı binası veya binası girer girmez durup yukarıdaki kurala göre ateş eder. Yukarıdaki ayarı gerektirir.
catapults_other_enemies: Menzildeki diğer düşmanlara da ateş et
catapults_other_enemies_details: Bir yapay zekâ mancınığı veya trebuşesi yalnızca kuşattığı oyuncuya ateş eder. O oyuncudan menzilde hiçbir şey yoksa diğer düşmanların surları ve binalarının yanından geçip gider. Bu ayar açıkken onlara da ateş eder; ancak kuşatılan oyuncunun surları ve binaları menzilde olduğu sürece önceliğini korur.
catapults_scatter: Yapay zekâ mancınık ve trebuşe sapması (%)
catapults_scatter_tooltip: Yapay zekâ mancınık ve trebuşe atışlarının oyuna kıyasla ne kadar saptığı. 100'ün altında sapma küçülür ve mancınığın atışları hedefe ortalanır. 100 değerinde atış sapması orijinal oyundaki gibi kalır. Kendi araçların değişmez.
diagnostics_group: Tanılama
diagnostics_group_descr: Test için. Bir yapay zekâ kalkanı, kuşatma kulesi veya mühendisi yeni bir hedef aldığında ucp3.log dosyasına bir satır, değiştiğinde ise her yapay zekânın kuşatma turu özetini (ne bulduğunu ve neyi atladığını) yazar.
diagnostics_log: Yapay zekâ kararlarını günlüğe yaz
diagnostics_log_details: Normal oyun için kapalı. Yapay zekânın kuşatma turlarını ve mancınık ya da trebuşelerin seçtiği her hedefi (nerede durduğu, hedef kare ve üzerinde ne olduğu) ucp3.log dosyasına yazar.
fixes: Düzeltmeler
improvements: İyileştirmeler
misc: Diğer
oil_aim: Yağı yalnızca açık zemine dök
oil_aim_details: 'Bir mühendis yağı yalnızca yanabileceği yere döker: açık zemine; asla sur, merdiven, kule veya başka bir binaya değil. Mühendisler kendi başlarına yalnızca böyle bir zeminde duran düşmanlara yağ döker. Uygun olmayan bir noktaya gönderdiğinde, mühendis senin noktanla arasındaki çizgiden en fazla 45 derece sapan ve en çok 4 kare uzaktaki en yakın zemine döker. Öyle bir yer yoksa yağını saklar ve birimlerin gidemediği yerlerdeki gibi «olanaksız konum» der. Kazan da artık döküldüğü noktadan yana kaymaz.'
oil_amount: Bir kazanın kapladığı kare sayısı
oil_amount_tooltip: Bir kazandan dökülen yağın kapladığı kare sayısı. 41, değiştirilmemiş oyunun açık zemindeki ateş alanıdır.
oil_damage: Yanan yağ temas ettiği binalara hasar verir
oil_damage_details: 'Diğer yüzü: yağın ulaştığı binalar temas anında bir kez hasar alır — kazanın düştüğü noktada canlarının üçte biri, yağ boyunca uzaklaştıkça daha az. Kendi binaların da dâhil. Oyunun ateşinin tutuşturabildiği tüm binalar buna girer: kulübeler, atölyeler, çiftlikler, değirmenler, ambar, cephanelik, kışla, pazar, ahırlar, loncalar, şapel, kilise, katedral, han, fırın, demirci, yağ kazanı vb. Surlar, kuleler, kapı binaları, iç kaleler, depolar, kuyular ve kuşatma çadırları hasar almaz. Ateşin kendisi değiştirilmemiş oyundaki gibi yayılır (kendi ateşin kendi binalarını asla tutuşturmaz).'
oil_group: Yağ mühendisleri
oil_group_details: Oyuncununkiler dâhil tüm yağ kazanlı mühendisler için geçerlidir. Değiştirilmemiş oyunda kazan bir noktaya atılır ve rastgele biraz kayar; sur, merdiven, kule veya başka bir engele düşerse yağ hiçbir işe yaramaz ve mühendis boş yere doldurmaya geri yürür. Ayrıca ateş, araziden bağımsız olarak her zaman aynı eşkenar dörtgeni oluşturur.
oil_spread: Yağ miktarına göre yayılır
oil_spread_details: 'Bir kazanın yağı düştüğü zemin boyunca akar: aynı miktardaki yağ aynı sayıda kareyi kaplar ve yalnızca benzer yükseklikteki kareler arasında akar, asla surdan veya dik basamaktan yukarı ya da aşağı gitmez. Mühendisin nişan aldığı yerden başlar — kazan kendi durduğu sura düşse bile. Açık zeminde bu tamamen orijinal oyundaki dökümle aynıdır (aynı ateş, parlayış ve yayılım). Dar bir geçitte daha uzağa aktığında boyunca ardışık kazanlar dökülmüş gibi görünür: yağ ilerledikçe her 5 karede bir, parlayışı ve düşme sesiyle yeni bir ateş başlar.'
shields_enabled: Kalkanlar kendi birlikleriyle yürür
shields_enabled_details: Yapay zekâ taşınabilir kalkanları hendek dolduran birliklere, saldırı ordusunun menzilli kuşatma araçlarına (yapay zekânın evde tuttuklarına değil) ve menzilli birliklerine (okçular, arbaletçiler, sapancılar, atlı okçular, ateş atıcılar) gider — yalnızca kendi oyuncusunun veya müttefikinin birimlerine, asla ana ordunun yakın dövüşçülerine değil. Yedek birlikler yalnızca bunların hiçbiri kalmadığında kalkan alır. Kalkanlar mevcut yerlere eşit dağıtılır (her yeni kalkan en az kalkan olan yere gider ve payını aşmadıkça orada kalır). Kimse yoksa kalkan durup bekler.
shields_group: Taşınabilir kalkanlar
shields_group_descr: Değiştirilmemiş oyunda yapay zekâ taşınabilir kalkanları yalnızca yedek birlikleri (en fazla üçünü) izler; birliği yok olan bir kalkan, birlik liderinin yerini alan herhangi bir birimin — hatta bir geyiğin — peşine takılabilir.
tags.behavior: Davranış
tents_engineers: Mühendisler çadırlarına her zaman ulaşır
tents_engineers_details: 'Değiştirilmemiş oyunda bir kuşatma çadırının girişine yolu kapanan mühendis vazgeçip boş boş bekler ve çadırın aracı asla yapılmaz. Artık her yapay zekâ turunda hâlâ mühendisi eksik olan çadırın girişi oyunun kendi kuralıyla kontrol edilir — kapalı giriş boş bir kenara taşınır — ve mühendisler yeniden gönderilir: önce vazgeçen veya yolda takılanlar, sonra yakındaki boş mühendisler (60 kare içinde). Dört yanı duvarla çevrili bir çadır yol açılana dek bekler, sonra mühendislerini alır.'
tents_free: Güvenli çadır noktalarını yeniden kullan
tents_free_details: Orada inşa eden birlik gittikten, üzerinde hiçbir şey kalmadıktan ve oradaki bir araca saldırabilecek kadar yakın düşman askeri olmadıktan sonra bir çadır noktası yeniden kullanılabilir (menzilleri dâhilindeki okçular, arbaletçiler, sapancılar, atlı okçular ve ateş atıcılar — kuledekiler dâhil — ile 10 kare içindeki kılıçlı veya mızraklılar). Balistalar sayılmaz; menzilleri o kadar uzundur ki neredeyse her noktayı elerdi.
tents_group: Kuşatma çadırları
tents_group_details: |-
  Yapay zekâ kuşatma çadırı yerlerini her kale için çıkardığı listeden seçer. Değiştirilmemiş oyunda bir kez kullanılan yer oyunun geri kalanı boyunca kullanılmış kalır; bu yüzden uzun oyunlarda tüm iyi yerler tükenir ve çadırlar giderek uzaklaşır — sonunda trebuşeler kaleye yetişemez ve öylece durur.

  Aşağıdaki iki anahtar bunu ayrı ayrı düzeltir. Yalnızca yapay zekâ oyuncuları etkilenir.
tents_range: Menzilli araç çadırlarını menzile göre yerleştir
tents_range_details: 'Mancınık, trebuşe ve ateş balistası çadırları aracın kaleye yetişebileceği yerlere konur: düşman surlarından, kulelerinden ve kapı binalarından ölçülerek menzilin biraz içine yerleştirilir, böylece içerideki hedeflere de ulaşır. Kuşatma kulesi, koçbaşı ve kalkan çadırları eskisi gibi yerleştirilir. Uygun yer yoksa yapay zekâ eskisi gibi kurar.'
tents_variation: Ne kadar daha yakın (kare)
tents_variation_tooltip: Her menzilli aracın çadırı, aracın menzilinin 0 ile bu sayı kadar kare içine yerleştirilir (çadır ve aracın çıkışı için daima en az 6 kare menzil içinde kalır, böylece en uzaktaki bile vurabilir) ve her çadır için biraz farklı seçilir. 0 tüm çadırları menzil sınırına koyar.
towers_ai_passengers: Yapay zekâ kuşatma kuleleri menzilli birlikleri bindirir
towers_ai_passengers_details: Bir yapay zekâ kuşatma kulesi 3 kare yakınında duran kendi okçularını, arbaletçilerini, sapancılarını ve ateş atıcılarını (en fazla 9 asker) üzerine alır ve sura taşır.
towers_dock: Kuşatma kuleleri daha fazla sura yanaşır
towers_dock_details: Oyun bir yanaşma noktası bulamadığında kule 3x3 alanının köşesiyle çapraz bir sura, o da olmazsa aynı sur boyunca en fazla üç kare öteye yanaşır. Oyuncununkiler dâhil tüm kuşatma kuleleri için geçerlidir.
towers_group: Kuşatma kuleleri
towers_group_details: Değiştirilmemiş oyunda bir kuşatma kulesi yalnızca önünde boş 3x3 alanı bulunan en az üç kare uzunluğundaki düz bir sur parçasına yanaşabilir; yapay zekâ da kuleleri yalnızca kendi listesindeki bu yerlere gönderir — çoğu zaman geç, böyle yerleri olmayan kalelere ise hiç göndermez.
towers_orders: Yapay zekâ kuşatma kuleleri kendi surunu bulur
towers_orders_details: 'Boşta duran bir yapay zekâ kuşatma kulesi yanaşabileceği en yakın düşman surunu (100 kare içinde) arayıp oraya gider; yoksa yapay zekânın kendi listesinden bir sur dener. Bu da sonuç vermezse — emir almazsa, yolda takılırsa veya kaleye hiçbir yerden yanaşılamıyorsa — bir sur erişilebilir olana kadar büyük bir kalkan gibi orduya eşlik eder: varsa devriyelerle, yoksa kuşatma korumasıyla, yoksa ana orduyla, yoksa saldırı ordusundan rastgele bir menzilli birlikle ve hiçbiri kalmadıysa yedek birliklerle.'
towers_passenger_lift: Yolcuları daha yukarı çiz (piksel)
towers_passenger_lift_tooltip: 'Yalnızca yolcuların çizildiği konumu etkiler: hareket eden bir kuşatma kulesinin üst güvertesinin altında duruyor gibi görünürlerse artırın, havada süzülüyorlarsa azaltın. Gerçek yükseklikleri — ve aşağıdan okların ya da kılıçların onlara ulaşması — her hâlükârda yanaşmış bir kuleyle aynıdır.'
towers_passengers: Piyadeler kuşatma kulelerine binebilir
towers_passengers_details: 'Piyadeleri seçip kuşatma kulelerinden birine işaret et: aracı kullanma okları görünür ve tıklayınca kuleye giderler. Ulaştıkça en fazla 9 asker tepeye çıkıp birlikte ilerler — okçular ve arbaletçiler kule giderken bile ateş eder. Yukarıda yanaşmış bir kuledeki kadar güvendedirler: aşağıdan gelen oklar üçte bir hasar verir ve kılıçlar ulaşamaz. Yolculuk sırasında seçilemezler. Kule bir sura yanaştığında üstünde kalıp devam ederler; kule yıkılırsa onunla birlikte ölürler. Kuleyi seçip üzerine işaret ederek indirme oklarını aç: ilk tık yolcuları etrafına indirir, ikinci tık eskisi gibi mühendisleri indirir.'
