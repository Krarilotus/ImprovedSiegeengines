ai: AI
balance_changes: 平衡调整
bugfixes: 错误修复
catapults_drop_destroyed: 停止射击已摧毁的建筑
catapults_drop_destroyed_details: 瞄准建筑的攻城器械（例如瞄准易燃建筑的火焰弩炮，或奉命攻打建筑的投石车）在目标被毁后仍会不断轰击空地且永不转移目标——游戏原版只检查建筑编号，而该编号在被新建筑复用前一直不变。现在一旦目标被毁就会立刻放弃并寻找新目标。适用于包括火焰弩炮在内的所有攻城器械。
catapults_enabled: 投石车和重型投石机自主选择目标
catapults_enabled_details: 关闭时：AI 的投石车和重型投石机完全按原版游戏方式选择目标。
catapults_group: 投石车与重型投石机
catapults_on_the_way: 投石车和重型投石机行进途中停下开火
catapults_on_the_way_details: 在原版游戏中，攻城器械只在静止时搜寻目标，因此行进中的 AI 投石车（无论是劫掠、随军推进还是缓慢逼近城墙）会径直路过射程内的一切目标。开启后，移动中的 AI 投石车或重型投石机会每隔片刻环顾四周，一旦有敌方城墙、塔楼、城门或建筑进入射程，便立刻停下并按上述优先级开火。需开启上方选项。
catapults_other_enemies: 也射击射程内的其他敌人
catapults_other_enemies_details: AI 的投石车或重型投石机原本只射击它正在围攻的玩家。当该玩家没有任何目标在射程内时，它会径直路过其他敌人的城墙和建筑。开启后，它会先轰击这些路过的敌人目标——但只要原定围攻玩家的城墙或建筑进入射程，仍优先打它们。
fixes: 修正
improvements: 改进
oil_aim: 仅向地面倾倒滚油
oil_aim_details: 工程师只向滚油能真正燃烧的位置倾倒：开阔地面，而不是城墙、阶梯、塔楼或其他建筑。自动行动时，工程师也只对站在这类地面上的敌人倾倒。如果你指定了不合适的位置，工程师会倾倒在距目标 4 格以内、偏离连线不超过 45 度的最近可用地面上；若附近没有可用地面，则会保留滚油并播报“无法到达”（与单位无法前往某处时相同）。油锅也不再偏离倾倒点。
oil_damage: 燃烧的滚油会损伤触及的建筑
oil_damage_details: 作为平衡代价：滚油流到建筑边缘时会对其造成一次伤害——落点处扣减其生命值的三分之一，沿油流越远伤害越低，玩家自己的建筑也不例外。受影响的包括所有可被游戏火焰点燃的建筑：民房、作坊、农场、磨坊、粮仓、军械库、兵营、市场、马厩、公会、礼拜堂、教堂、大教堂、酒馆、面包房、铁匠铺、油锅等。城墙、塔楼、城门、主堡、储藏区、水井和攻城帐篷不会受损。火焰本身的蔓延仍遵循原版规则（你自己的火焰不会引燃你自己的建筑）。
oil_group: 滚油工程师
oil_spread: 滚油按油量沿地形蔓延
oil_spread_details: 一锅滚油会沿落点地面实际流淌：同等油量始终覆盖相同格数，且只在高度相近的地块间流动，绝不会爬上或流下城墙或陡坎。油流从工程师瞄准处起始——即使油锅落在他所站的城墙上也是如此。在空地上效果与原版完全一致（同样的火焰、爆燃与蔓延）。在狭窄通道里油流延伸得更远，效果宛如沿路连续倾倒多锅滚油：每推进 5 格就会燃起新的火焰，并伴随爆燃与落地音效。
shields_enabled: 移动盾牌跟随己方部队行进
shields_enabled_details: AI 的移动盾牌会去掩护填护城河的部队、进攻军队中的远程攻城器械（不含守家器械）及其远程部队（弓箭手、弩手、投石兵、骑射手、火焰投掷兵）——仅掩护己方或盟友单位，绝不跟随主力近战部队。只有上述目标都不复存在时，后备部队才会分到盾牌。盾牌会均匀分配到各处（每个新盾牌前往盾牌最少的位置，只要未超额就会留在原地）。若全场无人可护，盾牌会原地待命。
tags.behavior: 行为
tents_engineers: 工程师总能顺利进入攻城帐篷
tents_engineers_details: 在原版游戏中，如果通往攻城帐篷入口的路被堵住，工程师就会放弃并原地发呆，帐篷永远造不出器械。现在每个 AI 轮次都会按游戏自身规则检查仍缺工程师的帐篷入口——被堵的入口会自动挪到空闲一侧——并重新派遣工程师：先召回放弃或卡在半路的工程师，再从附近（60 格内）调派空闲工程师。四周完全被围死的帐篷会一直等到通路打开后再接收工程师。
tents_free: 复用安全的帐篷选址
tents_free_details: 只要曾在此建造的部队已离开、地面空无一物，且附近没有能威胁此处器械的敌军（射程内的弓箭手、弩手、投石兵、骑射手和火焰投掷兵——包括站在塔楼上的——以及 10 格内的剑士或矛兵），该帐篷点位就可再次使用。弩炮不计入判定，因为其超远射程会排除几乎所有点位。
tents_group: 攻城帐篷
tents_range: 按射程放置远程器械帐篷
tents_range_details: 投石车、重型投石机和火焰弩炮的帐篷会建在能打到城堡的位置：从敌方城墙、塔楼和城门起算，略短于器械最大射程，使其也能打到城内目标。攻城塔、攻城锤和移动盾牌的帐篷仍按原版放置。若找不到合适位置，AI 会回退为原版选址。
towers_ai_passengers: AI 攻城塔搭载远程部队
towers_ai_passengers_details: AI 攻城塔会搭载周围 3 格内己方的弓箭手、弩手、投石兵和火焰投掷兵（最多 9 人），将他们运往城墙。
towers_dock: 攻城塔可搭靠更多城墙
towers_dock_details: 当原版找不到搭靠点时，攻城塔会用其 3x3 占地的角落搭靠斜向城墙；若仍不行，则沿同一段城墙最多偏移 3 格搭靠。适用于包括玩家在内的所有攻城塔。
towers_group: 攻城塔
towers_orders: AI 攻城塔自主寻找城墙
towers_orders_details: 空闲的 AI 攻城塔会寻找 100 格内最近的可搭靠敌方城墙并前往；若找不到则尝试 AI 列表中的城墙。若依然无果（未收到命令、卡在半路，或城堡根本无处可搭），它会像一面大盾牌一样随军推进直到有城墙进入范围：依次跟随巡逻队、攻城护卫、主力部队、随机一支进攻远程部队，若皆不存则跟随后备部队。
towers_passenger_slow: 载人的攻城塔移动更慢
towers_passenger_slow_tooltip: '载有 5 名或更多乘客（9 个位置的一半）的攻城塔，移动速度降低一档。'
towers_passengers: 步兵可搭乘攻城塔
towers_passengers_details: 选中步兵并指向你的一座攻城塔：会出现登乘器械的箭头，点击即可派他们过去。抵达后最多 9 人会爬上塔顶随塔行进——弓箭手和弩手在攻城塔移动途中也能射击。塔顶防护与已搭靠攻城塔相同：来自下方的箭矢仅造成三分之一伤害，近战刀剑无法触及。行进期间乘客无法被选中。攻城塔搭靠城墙后他们留在塔顶继续行动；塔毁则人亡。选中攻城塔并指向自身即可看到撤离箭头：第一次点击放下乘客，第二次点击照常撤出工程师。
