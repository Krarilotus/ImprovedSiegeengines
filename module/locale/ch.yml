ai: AI
balance_changes: 平衡性改动
bugfixes: 错误修复
catapults_drop_destroyed: 停止射击已摧毁的建筑
catapults_drop_destroyed_details: |-
  瞄准建筑的攻城器械（例如瞄准易燃建筑的火焰弩炮，或奉命攻打建筑的投石车）在目标被毁后仍会不断轰击空地且永不转移目标——游戏原版只检查建筑编号，而该编号在被新建筑复用前一直不变。现在一旦目标被毁就会立刻放弃并寻找新目标。适用于包括火焰弩炮在内的所有攻城器械。

  默认开启。
catapults_enabled: 投石车和重型投石机自主选择目标
catapults_enabled_details: |-
  关闭时：AI 的投石车和重型投石机完全按原版游戏方式选择目标。

  默认开启。
catapults_group: 投石车与重型投石机
catapults_group_details: |-
  在原版游戏中，AI 投石车每次只朝一个方向搜寻目标，而且只看尚未受损的高墙。找不到目标就会继续朝城堡推进，如果途中没被摧毁，最终会一直开到城墙脚下。

  开启后，AI 的投石车或重型投石机会先在最大射程内环视四周，找到最近的敌方城墙、塔楼或城门并原地开火。只有射程内不再有防御工事时，才会攻击农场、作坊、民房等民用建筑；只有射程内确实毫无目标时才会向前靠近。当原定攻击的玩家被击败（领主阵亡）后，它会转而轰击射程内的其他敌人。火焰弩炮原版已有此逻辑，保持不变。

  AI 投石车与重型投石机散布度（%） — AI 投石车和重型投石机炮弹偏离目标的程度（相对原版）。原版允许投石车石块短打最多 12 格（过远 4 格）及侧偏 6 格，重型投石机侧偏最多 6 格——远距离时大多数石块都砸在城墙前的空地上。低于 100 会按比例缩小散布，并将投石车落点居中对准目标。设为 100 保留原版精度。玩家自己的器械不受影响。

  默认：50。
catapults_on_the_way: 投石车和重型投石机行进途中停下开火
catapults_on_the_way_details: |-
  在原版游戏中，攻城器械只在静止时搜寻目标，因此行进中的 AI 投石车（无论是劫掠、随军推进还是缓慢逼近城墙）会径直路过射程内的一切目标。开启后，移动中的 AI 投石车或重型投石机会每隔片刻环顾四周，一旦有敌方城墙、塔楼、城门或建筑进入射程，便立刻停下并按上述优先级开火。需开启上方选项。

  默认开启。
catapults_other_enemies: 也射击射程内的其他敌人
catapults_other_enemies_details: |-
  AI 的投石车或重型投石机原本只射击它正在围攻的玩家。当该玩家没有任何目标在射程内时，它会径直路过其他敌人的城墙和建筑。开启后，它会先轰击这些路过的敌人目标——但只要原定围攻玩家的城墙或建筑进入射程，仍优先打它们。

  默认开启。
catapults_scatter: AI 投石车与重型投石机散布度（%）
diagnostics_group: 诊断
diagnostics_group_descr: 用于测试。每当 AI 的移动盾牌、攻城塔或工程师被指派新目标时向 ucp3.log 写入一行记录，并在每次 AI 攻城轮次发生变化时输出汇总（找到与忽略的目标）。
diagnostics_log: 将 AI 决策写入日志
diagnostics_log_details: |-
  正常游玩时保持关闭。将 AI 的攻城轮次以及投石车、重型投石机选择的每个目标（器械位置、目标格子及其上物体）写入 ucp3.log。

  默认关闭。
fixes: 修复
improvements: 改进
misc: 其他
oil_aim: 仅向地面倾倒滚油
oil_aim_details: |-
  工程师只向滚油能真正燃烧的位置倾倒：开阔地面，而不是城墙、阶梯、塔楼或其他建筑。自动行动时，工程师也只对站在这类地面上的敌人倾倒。如果你指定了不合适的位置，工程师会倾倒在距目标 4 格以内、偏离连线不超过 45 度的最近可用地面上；若附近没有可用地面，则会保留滚油并播报“无法到达”（与单位无法前往某处时相同）。油锅也不再偏离倾倒点。

  默认开启。
oil_amount: 单锅滚油覆盖的格数
oil_damage: 燃烧的滚油会损伤触及的建筑
oil_damage_details: |-
  作为平衡代价：滚油流到建筑边缘时会对其造成一次伤害——落点处扣减其生命值的三分之一，沿油流越远伤害越低，玩家自己的建筑也不例外。受影响的包括所有可被游戏火焰点燃的建筑：民房、作坊、农场、磨坊、粮仓、军械库、兵营、市场、马厩、公会、礼拜堂、教堂、大教堂、酒馆、面包房、铁匠铺、油锅等。城墙、塔楼、城门、主堡、储藏区、水井和攻城帐篷不会受损。火焰本身的蔓延仍遵循原版规则（你自己的火焰不会引燃你自己的建筑）。

  默认开启。
oil_group: 滚油工程师
oil_group_details: |-
  对所有携带油锅的工程师生效，包括玩家自己的。在原版游戏中，油锅砸下时会略微随机偏移；一旦落在城墙、阶梯、塔楼或其他障碍物上，滚油会完全白费，工程师还得白跑一趟回去重新取油。而且无论地形如何，火焰总是固定呈菱形。

  单锅滚油覆盖的格数 — 一锅滚油可覆盖的地块数量。41 与原版火焰在空地上的覆盖面积一致。

  默认：41。
oil_spread: 滚油按油量沿地形蔓延
oil_spread_details: |-
  一锅滚油会沿落点地面实际流淌：同等油量始终覆盖相同格数，且只在高度相近的地块间流动，绝不会爬上或流下城墙或陡坎。油流从工程师瞄准处起始——即使油锅落在他所站的城墙上也是如此。在空地上效果与原版完全一致（同样的火焰、爆燃与蔓延）。在狭窄通道里油流延伸得更远，效果宛如沿路连续倾倒多锅滚油：每推进 5 格就会燃起新的火焰，并伴随爆燃与落地音效。

  默认开启。
shields_enabled: 移动盾牌跟随己方部队行进
shields_enabled_details: |-
  AI 的移动盾牌会去掩护填护城河的部队、进攻军队中的远程攻城器械（不含守家器械）及其远程部队（弓箭手、弩手、投石兵、骑射手、火焰投掷兵）——仅掩护己方或盟友单位，绝不跟随主力近战部队。只有上述目标都不复存在时，后备部队才会分到盾牌。盾牌会均匀分配到各处（每个新盾牌前往盾牌最少的位置，只要未超额就会留在原地）。若全场无人可护，盾牌会原地待命。

  默认开启。
shields_group: 移动盾牌
shields_group_descr: 在原版游戏中，AI 的移动盾牌最多只跟随三支后备部队，且一旦原部队覆灭，盾牌甚至可能追着接替原队长编号的任何单位跑——包括鹿。
tags.behavior: 行为
tents_engineers: 工程师总能顺利进入攻城帐篷
tents_engineers_details: |-
  在原版游戏中，如果通往攻城帐篷入口的路被堵住，工程师就会放弃并原地发呆，帐篷永远造不出器械。现在每个 AI 轮次都会按游戏自身规则检查仍缺工程师的帐篷入口——被堵的入口会自动挪到空闲一侧——并重新派遣工程师：先召回放弃或卡在半路的工程师，再从附近（60 格内）调派空闲工程师。四周完全被围死的帐篷会一直等到通路打开后再接收工程师。

  默认开启。
tents_free: 复用安全的帐篷选址
tents_free_details: |-
  只要曾在此建造的部队已离开、地面空无一物，且附近没有能威胁此处器械的敌军（射程内的弓箭手、弩手、投石兵、骑射手和火焰投掷兵——包括站在塔楼上的——以及 10 格内的剑士或矛兵），该帐篷点位就可再次使用。弩炮不计入判定，因为其超远射程会排除几乎所有点位。

  默认开启。
tents_group: 攻城帐篷
tents_group_details: |-
  AI 会从为每座城堡预先计算好的列表中挑选攻城帐篷点位。在原版游戏中，用过一次的点位会在整局游戏里一直标记为已占用，导致漫长对局中好点位全被耗光，帐篷越建越远——直到造出的重型投石机够不到城堡只能干瞪眼。

  下方两个开关分别修复这一问题。仅影响 AI 玩家。

  向内贴近的距离（格） — 每座远程器械帐篷会建在比最大射程更靠近城堡 0 到该数值格的位置（始终至少位于射程内 6 格，为帐篷占地与器械驶出留出余量，确保最远帐篷也能打到），每座帐篷略有变化。设为 0 会将所有帐篷建在射程边缘。

  默认：10。
tents_range: 按射程放置远程器械帐篷
tents_range_details: |-
  投石车、重型投石机和火焰弩炮的帐篷会建在能打到城堡的位置：从敌方城墙、塔楼和城门起算，略短于器械最大射程，使其也能打到城内目标。攻城塔、攻城锤和移动盾牌的帐篷仍按原版放置。若找不到合适位置，AI 会回退为原版选址。

  默认开启。
tents_variation: 向内贴近的距离（格）
towers_ai_passengers: AI 攻城塔搭载远程部队
towers_ai_passengers_details: |-
  AI 攻城塔会搭载周围 3 格内己方的弓箭手、弩手、投石兵和火焰投掷兵（最多 9 人），将他们运往城墙。

  默认开启。
towers_dock: 攻城塔可搭靠更多城墙
towers_dock_details: |-
  当原版找不到搭靠点时，攻城塔会用其 3x3 占地的角落搭靠斜向城墙；若仍不行，则沿同一段城墙最多偏移 3 格搭靠。适用于包括玩家在内的所有攻城塔。该功能原属 Smarter Walls，自其 1.0.16 版本起移至本模块。

  默认开启。
towers_group: 攻城塔
towers_group_details: |-
  在原版游戏中，攻城塔只能搭靠至少 3 格长的笔直城墙且前方须有 3x3 空地，而 AI 只会把攻城塔派往其列表中的这类位置——往往很晚出动，面对没有此类城墙的城堡甚至完全不动。

  乘客绘制高度偏移（像素） — 仅影响乘客的画面显示位置：如果移动中的攻城塔乘客看起来陷在顶层甲板下方，请调高此值；若浮在空中则调低。无论如何，他们的实际高度（以及下方箭矢和近战能否打到）都与已搭靠的攻城塔一致。

  默认：4。
towers_orders: AI 攻城塔自主寻找城墙
towers_orders_details: |-
  空闲的 AI 攻城塔会寻找 100 格内最近的可搭靠敌方城墙并前往；若找不到则尝试 AI 列表中的城墙。若依然无果（未收到命令、卡在半路，或城堡根本无处可搭），它会像一面大盾牌一样随军推进直到有城墙进入范围：依次跟随巡逻队、攻城护卫、主力部队、随机一支进攻远程部队，若皆不存则跟随后备部队。

  默认开启。
towers_passenger_lift: 乘客绘制高度偏移（像素）
towers_passengers: 步兵可搭乘攻城塔
towers_passengers_details: |-
  选中步兵并指向你的一座攻城塔：会出现登乘器械的箭头，点击即可派他们过去。抵达后最多 9 人会爬上塔顶随塔行进——弓箭手和弩手在攻城塔移动途中也能射击。塔顶防护与已搭靠攻城塔相同：来自下方的箭矢仅造成三分之一伤害，近战刀剑无法触及。行进期间乘客无法被选中。攻城塔搭靠城墙后他们留在塔顶继续行动；塔毁则人亡。选中攻城塔并指向自身即可看到撤离箭头：第一次点击放下乘客，第二次点击照常撤出工程师。

  默认开启。
